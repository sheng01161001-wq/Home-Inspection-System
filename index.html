<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小棒槌 驗屋系統</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#16202c; --muted:#627080; --line:#d9e1ea;
  --accent:#e4572e; --accent-soft:#fdece6; --steel:#1f3a5f; --ok:#2b8a3e; --ok-soft:#e6f4ea;
  --warn:#d9480f; --na:#868e96;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.5;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:var(--steel);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font-size:16px;background:var(--steel);color:#fff;cursor:pointer;font-family:inherit}
.btn.accent{background:var(--accent)}
.btn.ghost{background:#fff;color:var(--steel);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.block{display:block;width:100%;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;margin:8px 0 4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:60px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list-item{display:flex;align-items:center;gap:12px;cursor:pointer}
.list-item .ic{font-size:28px;width:40px;text-align:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}
.badge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:13px;background:var(--line);color:var(--ink);margin-left:4px}
.badge.ng{background:var(--accent);color:#fff}
.badge.ok{background:var(--ok);color:#fff}
.badge.fix{background:#1971c2;color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:52px;z-index:5;background:var(--bg);padding:6px 0}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px;font-size:14px;font-family:inherit}
.tabs button.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.group-h{font-weight:bold;color:var(--steel);margin:16px 4px 6px;font-size:15px}
.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border-left:5px solid var(--line)}
.item.s-ok{border-left-color:var(--ok)}
.item.s-ng{border-left-color:var(--accent);background:#fffaf8}
.item.s-na{border-left-color:var(--na);opacity:.7}
.item.fixed{border-left-color:#1971c2}
.it-top{display:flex;gap:8px;align-items:flex-start}
.it-t{flex:1;font-weight:bold}
.info{border:1px solid var(--line);background:#fff;border-radius:50%;width:28px;height:28px;font-size:14px;color:var(--steel);flex:none}
.tip{background:#f3f6fa;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px;color:#33414f}
.sbtns{display:flex;gap:6px;margin-top:8px}
.sbtns button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;font-size:15px;font-family:inherit}
.sbtns .on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.sbtns .on-ng{background:var(--accent);color:#fff;border-color:var(--accent)}
.sbtns .on-na{background:var(--na);color:#fff;border-color:var(--na)}
.ngbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:14px;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sev1.on{background:#f59f00;border-color:#f59f00}
.chip.sev3.on{background:#c92a2a;border-color:#c92a2a}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;background:#ddd}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:22px;padding:0}
.addph{width:76px;height:76px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;color:var(--muted);cursor:pointer;background:#fff}
.addph input{display:none}
.fixbtn{margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat div{background:#f3f6fa;border-radius:8px;padding:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:70;font-size:14px}
ol.tips li,ul.tools li{margin-bottom:6px}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}

/* 建案樓層一覽 */
.stat5{grid-template-columns:repeat(5,1fr);gap:4px}
.stat5 div{font-size:12px;padding:6px 2px;white-space:nowrap}
.stat5 b{font-size:19px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12px}
.legend span{padding:2px 8px;border-radius:10px}
.floor{padding:8px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.floor .fn{width:46px;flex:none;font-weight:bold;font-size:16px;text-align:center;border:0;background:none;font-family:inherit;color:var(--steel);padding:4px 0}
.units{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.unit{border:0;border-radius:8px;padding:5px 2px;font-family:inherit;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.unit b{font-size:17px}.unit small{font-size:11px}
.u-none{background:#e9ecef;color:#495057}
.u-doing{background:#fff3bf;color:#7a5a00}
.u-ng{background:var(--accent);color:#fff}
.u-fixed{background:#d0ebff;color:#1864ab}
.u-ok{background:var(--ok);color:#fff}
.st{padding:1px 6px;border-radius:8px;font-size:12px;white-space:nowrap}
.lay{margin-bottom:6px}.lay input{width:56px;padding:6px}
@media print{.st,.u-ng,.u-ok{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* 報告 */
.report h2{font-size:20px;margin:0 0 4px}
.report table{width:100%;border-collapse:collapse;font-size:14px}
.report th,.report td{border:1px solid #bbb;padding:6px;vertical-align:top;text-align:left}
.report th{background:#eef2f7}
.report .rph{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.report .rph img{width:120px;height:90px;object-fit:cover;border:1px solid #ccc}
.sev-t{font-weight:bold;white-space:nowrap}
.sev-t.s3{color:#c92a2a}.sev-t.s2{color:var(--warn)}.sev-t.s1{color:#e67700}
.sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:24px}
.sign div{border-top:1px solid #333;padding-top:4px;font-size:14px;text-align:center}
@media print{
  header,.noprint{display:none!important}
  body{background:#fff;padding:0}
  main{max-width:none;padding:0}
  .card{box-shadow:none;padding:0}
  .report tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <button id="backBtn" onclick="goBack()" style="display:none">‹ 返回</button>
  <h1 id="title">小棒槌 驗屋系統</h1>
  <button id="hdrRight" style="display:none"></button>
</header>
<main id="app"></main>
<div id="layer"></div>

<script src="data.js"></script>
<script>
'use strict';
const VERSION = 'v2';

// ── 小工具 ─────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 本地日期 YYYY-MM-DD（toISOString 是 UTC，台灣早上 8 點前會變昨天）
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const num = (v, min, max) => Math.max(min, Math.min(max, parseInt(v, 10) || 0));

// 檢查項目的「怎麼驗」與常見缺失字，從 data.js 查（不存進每一戶，省空間）
const HELP = {};
Object.values(TEMPLATES).forEach(tp => tp.groups.forEach(([, list]) => list.forEach(it => { if (!HELP[it.t]) HELP[it.t] = it; })));
const helpOf = it => HELP[it.t] || { h: '', q: [] };

// ── 資料存取（全部放 IndexedDB，整個建案幾百戶也放得下）─────────
let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('home-inspection', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idbPut(store, key, val) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbGet(store, key) {
  const d = await db();
  return new Promise(res => { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
}
async function photoDel(id) {
  delete photoCache[id];
  const d = await db();
  return new Promise(res => { const t = d.transaction('photos', 'readwrite'); t.objectStore('photos').delete(id); t.oncomplete = res; t.onerror = res; });
}
let state = { projects: [] };
let saveTimer, saving = Promise.resolve();
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 200); }
function saveNow() {
  clearTimeout(saveTimer);
  saving = saving.then(() => idbPut('kv', 'state', state)).catch(e => toast('儲存失敗：' + e.message));
  return saving;
}
// 切走或關 App 時立刻存
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);

const photoCache = {};
async function hydratePhotos(root) {
  for (const img of (root || document).querySelectorAll('img[data-pid]')) {
    const id = img.dataset.pid;
    if (!photoCache[id]) photoCache[id] = await idbGet('photos', id);
    if (photoCache[id]) img.src = photoCache[id];
  }
}
// 壓縮照片：長邊 1280px、JPEG 品質 0.7
function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('讀不到照片')); };
    im.src = url;
  });
}

// ── 資料結構 ─────────────────────────────
// 建案 project { id, name, addr, floors:[floor] }
// 樓層 floor   { id, name, units:[unit] }
// 戶別 unit    { id, name, layout:{beds,baths,balc,common}, insp:null | { date, inspector, owner, phone, round, rooms:[room] } }
// 空間 room    { id, type, name, items:[{ id, g, t, s, sev, note, tags, photos, fixed }] }
const newItem = (g, t) => ({ id: uid(), g, t, s: '', sev: 2, note: '', tags: [], photos: [], fixed: false });
function makeRoom(type, name) {
  const tp = TEMPLATES[type], items = [];
  tp.groups.forEach(([g, list]) => list.forEach(it => items.push(newItem(g, it.t))));
  return { id: uid(), type, name: name || tp.name, items };
}
function makeRooms(L) {
  const rooms = [makeRoom('doc'), makeRoom('entry'), makeRoom('living'), makeRoom('kitchen')];
  for (let n = 1; n <= L.beds; n++) rooms.push(makeRoom('bed', n === 1 ? '主臥室' : '臥室' + n));
  for (let n = 1; n <= L.baths; n++) rooms.push(makeRoom('bath', n === 1 ? (L.baths > 1 ? '主臥浴室' : '浴室') : '浴室' + n));
  for (let n = 1; n <= L.balc; n++) rooms.push(makeRoom('balcony', L.balc === 1 ? '陽台' : (n === 1 ? '前陽台' : n === 2 ? '工作陽台' : '陽台' + n)));
  rooms.push(makeRoom('mep'));
  if (L.common) rooms.push(makeRoom('common'));
  return rooms;
}
function stats(items) {
  const r = { total: 0, done: 0, ok: 0, ng: 0, na: 0, fixed: 0 };
  items.forEach(it => { r.total++; if (it.s) r.done++; if (it.s === 'ok') r.ok++; if (it.s === 'na') r.na++; if (it.s === 'ng') { r.ng++; if (it.fixed) r.fixed++; } });
  return r;
}
const unitItems = u => u.insp ? u.insp.rooms.flatMap(r => r.items) : [];
const unitLabel = (f, u) => `${f.name}-${u.name}`;
// 戶別狀態：未驗／驗屋中／有缺失／完成／已改善
function unitStatus(u) {
  if (!u.insp) return { k: 'none', t: '未驗' };
  const s = stats(unitItems(u)), open = s.ng - s.fixed;
  if (open > 0) return { k: 'ng', t: `缺失 ${open}`, s };
  if (!s.total || s.done < s.total) return { k: 'doing', t: `驗屋中 ${s.total ? Math.round(s.done / s.total * 100) : 0}%`, s };
  if (s.ng) return { k: 'fixed', t: '已改善', s };
  return { k: 'ok', t: '合格', s };
}
function floorSort(a, b) {
  // 高樓層在上；B1、B2 在最下面
  const v = n => { if (/^(R|屋)/i.test(n)) return 999; const m = /^B(\d+)/i.exec(n); if (m) return -parseInt(m[1], 10); const k = parseInt(n, 10); return isNaN(k) ? 0 : k; };
  return v(b.name) - v(a.name);
}

// ── 畫面切換 ─────────────────────────────
let view = { name: 'home' };
const stack = [];
const app = document.getElementById('app');
// 每換一頁寫一筆瀏覽器歷史，手機返回鍵／手勢才會回上一頁而不是跳出 App
function go(v) { stack.push(view); view = v; history.pushState({ d: stack.length }, ''); render(true); }
function goBack() { if (stack.length) history.back(); else { view = { name: 'home' }; render(true); } }
window.addEventListener('popstate', () => {
  const l = document.getElementById('layer');
  if (l.innerHTML) { l.innerHTML = ''; history.pushState({ d: stack.length }, ''); return; } // 先關掉彈出視窗
  view = stack.pop() || { name: 'home' }; render(true);
});
const curP = () => state.projects.find(p => p.id === view.pid);
const curF = () => { const p = curP(); return p && p.floors.find(f => f.id === view.fid); };
const curU = () => { const f = curF(); return f && f.units.find(u => u.id === view.uid); };
const curRoom = () => { const u = curU(); return u && u.insp && u.insp.rooms.find(r => r.id === view.rid); };

function setHeader(title, back, right) {
  document.getElementById('title').textContent = title;
  document.getElementById('backBtn').style.display = back ? '' : 'none';
  const b = document.getElementById('hdrRight');
  if (right) { b.style.display = ''; b.textContent = right[0]; b.onclick = right[1]; } else b.style.display = 'none';
}
const VIEWS = {};
function render(top) {
  const y = window.scrollY;
  (VIEWS[view.name] || VIEWS.home)();
  hydratePhotos(app);
  window.scrollTo(0, top ? 0 : y);
}
// 找不到資料（被刪了）就回首頁
function lost() { view = { name: 'home' }; stack.length = 0; VIEWS.home(); }

// ── 首頁：建案列表 ─────────────────────────
VIEWS.home = () => {
  setHeader('小棒槌 驗屋系統', false, ['📘 驗屋要領', () => go({ name: 'guide' })]);
  let h = `<button class="btn accent block" onclick="go({name:'newProject'})">＋ 新增建案</button><div style="height:12px"></div>`;
  if (!state.projects.length) h += `<div class="card empty">還沒有建案<br>按上面「新增建案」，輸入樓層與戶別就會自動排好</div>`;
  state.projects.forEach(p => {
    const units = p.floors.flatMap(f => f.units);
    const cnt = { none: 0, doing: 0, ng: 0, ok: 0, fixed: 0 };
    units.forEach(u => cnt[unitStatus(u).k]++);
    const done = cnt.ok + cnt.fixed;
    h += `<div class="card list-item" onclick="go({name:'project',pid:'${p.id}'})">
      <div class="ic">🏢</div>
      <div class="grow"><b>${esc(p.name)}</b>
        <div class="muted">${esc(p.addr || '')}　${p.floors.length} 層 ${units.length} 戶</div>
        <div class="muted">完成 ${done}　有缺失 <b style="color:var(--accent)">${cnt.ng}</b>　驗屋中 ${cnt.doing}　未驗 ${cnt.none}</div>
        <div class="bar"><i style="width:${units.length ? done / units.length * 100 : 0}%"></i></div>
      </div></div>`;
  });
  h += `<div class="card noprint"><b>資料備份</b><div class="muted">資料只存在這支手機（平板），換機或清除瀏覽器資料前請先匯出備份（含照片）。</div>
    <div class="row" style="margin-top:8px"><button class="btn ghost small" onclick="exportAll()">匯出備份</button>
    <label class="btn ghost small">匯入備份<input type="file" accept=".json,application/json" style="display:none" onchange="importAll(this)"></label></div></div>
    <div class="ver">版本 ${VERSION}</div>`;
  app.innerHTML = h;
};

// ── 新增建案 ─────────────────────────────
VIEWS.newProject = () => {
  setHeader('新增建案', true);
  app.innerHTML = `<div class="card">
    <label class="f">建案名稱 *</label><input type="text" id="p_name" placeholder="例：小棒槌一期">
    <label class="f">地址</label><input type="text" id="p_addr">
    <label class="f">樓層範圍</label>
    <div class="row"><input type="number" id="p_from" value="2" style="width:80px"> F　到　<input type="number" id="p_to" value="12" style="width:80px"> F</div>
    <div class="muted">一樓店面、地下室之後可在建案頁「＋新增樓層」自己加。</div>
    <label class="f">每層戶別（用逗號分開）</label>
    <input type="text" id="p_units" value="A,B,C" oninput="drawLayouts()">
    <label class="f">各戶別格局（會自動產生對應的檢查表，個別戶驗屋時還能改）</label>
    <div id="p_layouts"></div>
    <label class="row" style="margin-top:10px"><input type="checkbox" id="p_common"> 每戶都檢查公設與停車位</label>
    <button class="btn accent block" onclick="createProject()">建立建案</button>
  </div>`;
  drawLayouts();
};
const parseUnits = s => [...new Set(s.split(/[,，、\s]+/).map(x => x.trim()).filter(Boolean))].slice(0, 30);
function drawLayouts() {
  const box = document.getElementById('p_layouts');
  const old = {};
  box.querySelectorAll('[data-u]').forEach(r => { old[r.dataset.u] = [...r.querySelectorAll('input')].map(i => i.value); });
  box.innerHTML = parseUnits(document.getElementById('p_units').value).map(u => {

    return `<div class="row lay" data-u="${esc(u)}"><b style="width:44px">${esc(u)} 戶</b>
      <input type="number" value="${esc(v[0])}" min="0" max="8"> 房 <input type="number" value="${esc(v[1])}" min="0" max="6"> 衛 <input type="number" value="${esc(v[2])}" min="0" max="5"> 陽台</div>`;

function createProject() {
  const v = id => document.getElementById(id).value.trim();
  if (!v('p_name')) { toast('請填建案名稱'); return; }
  const from = parseInt(v('p_from'), 10), to = parseInt(v('p_to'), 10);
  if (isNaN(from) || isNaN(to) || to < from || to - from > 80) { toast('樓層範圍不對'); return; }
  const layouts = {};
  document.querySelectorAll('#p_layouts [data-u]').forEach(r => {
    const n = [...r.querySelectorAll('input')].map(i => i.value);
    layouts[r.dataset.u] = { beds: num(n[0], 0, 8), baths: num(n[1], 0, 6), balc: num(n[2], 0, 5), common: document.getElementById('p_common').checked };
  });
  const names = Object.keys(layouts);
  if (!names.length) { toast('請填戶別'); return; }
  const floors = [];
  for (let k = to; k >= from; k--) {
    if (k === 0) continue;
    floors.push({ id: uid(), name: k > 0 ? k + 'F' : 'B' + (-k), units: names.map(n => ({ id: uid(), name: n, layout: { ...layouts[n] }, insp: null })) });
  }
  const p = { id: uid(), name: v('p_name'), addr: v('p_addr'), layouts, floors, created: Date.now() };
  state.projects.unshift(p); save();
  stack.pop(); view = { name: 'project', pid: p.id }; history.replaceState({ d: stack.length }, ''); stack.push({ name: 'home' }); render(true);
}

VIEWS.room = () => {
  const f = curF(), u = curU(), r = curRoom(); if (!r) return lost();
  setHeader(`${unitLabel(f, u)}｜${r.name}`, true);
  const fl = view.f || 'all';
  const s = stats(r.items);
  const cnt = { all: s.total, todo: s.total - s.done, ng: s.ng };
  let h = `<div class="tabs">${[['all', '全部'], ['todo', '未檢'], ['ng', '缺失']].map(([k, n]) =>
    `<button class="${fl === k ? 'on' : ''}" onclick="view.f='${k}';render(true)">${n} ${cnt[k]}</button>`).join('')}</div>`;
  let lastG = null, shown = 0;
  r.items.forEach(it => {
    if (fl === 'todo' && it.s) return;
    if (fl === 'ng' && it.s !== 'ng') return;
    if (it.g !== lastG) { h += `<div class="group-h">${esc(it.g)}</div>`; lastG = it.g; }
    h += itemHTML(it, u.insp.round); shown++;
  });
  if (!shown) h += `<div class="card empty">${fl === 'todo' ? '這個空間都檢查完了 👍' : fl === 'ng' ? '沒有缺失 👍' : '沒有項目'}</div>`;
  h += `<div class="card noprint">
    <button class="btn ghost block" onclick="addItem()">＋ 自訂檢查項目</button>
    <button class="btn ghost block" onclick="restOk()">✔ 其餘未檢項目都設為合格</button>
    <button class="btn ghost block" onclick="renameRoom()">✏️ 改空間名稱</button>
    <button class="btn ghost block" style="color:var(--accent)" onclick="delRoom()">🗑 刪除這個空間</button></div>`;
  app.innerHTML = h;
};
function itemHTML(it, round) {
  const hp = helpOf(it);
  const cls = it.s === 'ng' ? (it.fixed ? 's-ng fixed' : 's-ng') : it.s ? 's-' + it.s : '';
  let h = `<div class="item ${cls}" id="it_${it.id}">
    <div class="it-top"><div class="it-t">${esc(it.t)}</div>${hp.h ? `<button class="info" onclick="toggleTip('${it.id}')">?</button>` : ''}</div>
    <div class="tip" id="tip_${it.id}" style="display:${openTips.has(it.id) ? 'block' : 'none'}">${esc(hp.h)}</div>
    <div class="sbtns">
      <button class="${it.s === 'ok' ? 'on-ok' : ''}" onclick="setS('${it.id}','ok')">✔ 合格</button>
      <button class="${it.s === 'ng' ? 'on-ng' : ''}" onclick="setS('${it.id}','ng')">✘ 缺失</button>
      <button class="${it.s === 'na' ? 'on-na' : ''}" onclick="setS('${it.id}','na')">不適用</button></div>`;
  if (it.s === 'ng') {
    h += `<div class="ngbox">
      <div class="muted">嚴重程度</div>
      <div class="chips">${[[1, '輕微'], [2, '中等'], [3, '嚴重']].map(([v, n]) =>
        `<button class="chip sev${v} ${it.sev === v ? 'on' : ''}" onclick="setSev('${it.id}',${v})">${n}</button>`).join('')}</div>
      ${hp.q.length ? `<div class="muted">缺失類型（可複選）</div><div class="chips">${hp.q.map((q, k) =>
        `<button class="chip ${it.tags.includes(q) ? 'on' : ''}" onclick="toggleTag('${it.id}',${k})">${esc(q)}</button>`).join('')}</div>` : ''}
      <textarea placeholder="位置與說明（例：靠窗左側第 3 塊、裂縫約 0.3 mm）" oninput="setNote('${it.id}',this.value)">${esc(it.note)}</textarea>
      <div class="photos">${it.photos.map(ph => `<div class="ph"><img data-pid="${ph}" onclick="viewPhoto('${ph}')"><button onclick="delPhoto('${it.id}','${ph}')">✕</button></div>`).join('')}
        <label class="addph">📷<span>拍照</span><input type="file" accept="image/*" capture="environment" onchange="addPhoto('${it.id}',this)"></label>
        <label class="addph">🖼️<span>相簿</span><input type="file" accept="image/*" multiple onchange="addPhoto('${it.id}',this)"></label></div>
      ${round > 1 || it.fixed ? `<button class="btn small fixbtn ${it.fixed ? '' : 'ghost'}" onclick="toggleFixed('${it.id}')">${it.fixed ? '✔ 複驗：已改善' : '複驗：標為已改善'}</button>` : ''}
    </div>`;
  }
  return h + '</div>';
}
const openTips = new Set();
const findItem = id => curRoom().items.find(x => x.id === id);
function toggleTip(id) { openTips.has(id) ? openTips.delete(id) : openTips.add(id); document.getElementById('tip_' + id).style.display = openTips.has(id) ? 'block' : 'none'; }
function setS(id, s) { const it = findItem(id); it.s = it.s === s ? '' : s; if (it.s !== 'ng') it.fixed = false; save(); render(); }
function setSev(id, v) { findItem(id).sev = v; save(); render(); }
function toggleTag(id, k) { const it = findItem(id), q = helpOf(it).q[k]; const i = it.tags.indexOf(q); i < 0 ? it.tags.push(q) : it.tags.splice(i, 1); save(); render(); }
function setNote(id, v) { findItem(id).note = v; save(); }
function toggleFixed(id) { const it = findItem(id); it.fixed = !it.fixed; save(); render(); }
async function addPhoto(id, input) {
  const it = findItem(id);
  const files = [...input.files]; input.value = '';
  for (const fl of files) {
    try { const data = await compress(fl); const pid = uid(); await idbPut('photos', pid, data); photoCache[pid] = data; it.photos.push(pid); }
    catch (e) { toast('照片儲存失敗：' + e.message); }

  save(); render();
}
async function delPhoto(id, pid) {

function addItem() {

function restOk() {

  u.insp.rooms = u.insp.rooms.filter(x => x !== r); save(); goBack();
}

// ── 彈出視窗 ─────────────────────────────
function sheet(html) { document.getElementById('layer').innerHTML = `<div class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`; }
function closeSheet() { document.getElementById('layer').innerHTML = ''; }

// ── 單戶驗屋報告 ─────────────────────────
const SEV = { 1: '輕微', 2: '中等', 3: '嚴重' };
VIEWS.report = () => {
  const p = curP(), f = curF(), u = curU(); if (!u || !u.insp) return lost();
  const I = u.insp, label = unitLabel(f, u);
  setHeader(`${label} 驗屋報告`, true, ['🖨 列印／PDF', () => window.print()]);
  const items = unitItems(u), s = stats(items);
  const sevCount = { 1: 0, 2: 0, 3: 0 };
  items.forEach(it => { if (it.s === 'ng') sevCount[it.sev]++; });
  let n = 0, rows = '';
  I.rooms.forEach(r => r.items.forEach(it => {
    if (it.s !== 'ng') return;
    n++;
    const desc = [it.tags.join('、'), it.note].filter(Boolean).map(esc).join('<br>');
    rows += `<tr><td>${n}</td><td>${esc(r.name)}</td><td><b>${esc(it.t)}</b>${desc ? '<br>' + desc : ''}
      ${it.photos.length ? `<div class="rph">${it.photos.map(ph => `<img data-pid="${ph}">`).join('')}</div>` : ''}</td>
      <td class="sev-t s${it.sev}">${SEV[it.sev]}</td><td>${it.fixed ? '✔ 已改善' : '待改善'}</td></tr>`;
  }));
  const todo = s.total - s.done;
  app.innerHTML = `<div class="card report">
    <h2>住戶驗屋缺失紀錄表</h2>
    <div>建案：${esc(p.name)}　戶別：<b>${esc(label)}</b><br>地址：${esc(p.addr || '—')}<br>
      住戶：${esc(I.owner || '—')}　${esc(I.phone || '')}<br>驗屋日期：${esc(I.date || '—')}（第 ${I.round} 次）　陪驗人員：${esc(I.inspector || '—')}</div>
    <p>檢查項目共 ${s.total} 項，合格 ${s.ok} 項、不適用 ${s.na} 項、<b>缺失 ${s.ng} 項</b>
      （嚴重 ${sevCount[3]}、中等 ${sevCount[2]}、輕微 ${sevCount[1]}）${s.fixed ? `，其中已改善 ${s.fixed} 項` : ''}。
      ${todo ? `<span class="noprint" style="color:var(--accent)">（還有 ${todo} 項未檢查）</span>` : ''}</p>
    ${n ? `<table><thead><tr><th>#</th><th>位置</th><th>缺失內容</th><th>程度</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<p>本次檢查無缺失。</p>'}
    <p style="font-size:14px;margin-top:16px">以上缺失經雙方現場確認，本公司將於　　年　　月　　日前改善完成，並通知住戶複驗。</p>
    <div class="sign"><div>住戶簽名</div><div>公司陪驗人員</div><div>日期</div></div>
  </div>
  <div class="card noprint muted">按右上「列印／PDF」，印表機選「另存為 PDF」就能存成 PDF。手機 Chrome：右上選單 → 分享 → 列印。</div>`;
};

// ── 建案總表（給工務派工用）─────────────────
VIEWS.projReport = () => {
  const p = curP(); if (!p) return lost();
  setHeader(`${p.name} 總表`, true, ['🖨 列印／PDF', () => window.print()]);
  const mode = view.mode || 'units', gsel = view.g || '';
  const floors = [...p.floors].sort(floorSort).reverse();
  let body = '';
  if (mode === 'units') {
    let rows = '';
    floors.forEach(f => f.units.forEach(u => {
      const st = unitStatus(u), I = u.insp, s = st.s;
      rows += `<tr><td><b>${esc(unitLabel(f, u))}</b></td><td>${esc(I ? I.owner : '')}</td><td>${esc(I ? I.date : '')}</td>
        <td>${I ? I.round : ''}</td><td>${s ? s.done + '/' + s.total : ''}</td><td>${s ? s.ng : ''}</td><td>${s ? s.fixed : ''}</td>
        <td><span class="st u-${st.k}">${st.t}</span></td></tr>`;
    }));
    body = `<table><thead><tr><th>戶別</th><th>住戶</th><th>驗屋日</th><th>次</th><th>已檢</th><th>缺失</th><th>已改善</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    // 缺失明細：依工項分類，方便派給各工班
    const list = [], groups = new Set();
    floors.forEach(f => f.units.forEach(u => (u.insp ? u.insp.rooms : []).forEach(r => r.items.forEach(it => {
      if (it.s !== 'ng') return;
      groups.add(it.g);
      if (view.open && it.fixed) return;
      if (!gsel || it.g === gsel) list.push({ f, u, r, it });
    }))));
    body = `<div class="row noprint" style="margin-bottom:8px">
        <select onchange="view.g=this.value;render(true)" style="width:auto;flex:1"><option value="">全部工項</option>${[...groups].map(g =>
          `<option ${g === gsel ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
        <label class="row"><input type="checkbox" ${view.open ? 'checked' : ''} onchange="view.open=this.checked;render(true)"> 只看待改善</label></div>
      <div style="margin-bottom:6px">${gsel ? '工項：' + esc(gsel) + '　' : ''}共 ${list.length} 項</div>
      ${list.length ? `<table><thead><tr><th>戶別</th><th>位置</th><th>工項</th><th>缺失內容</th><th>程度</th><th>狀態</th></tr></thead><tbody>${list.map(({ f, u, r, it }) =>
        `<tr><td><b>${esc(unitLabel(f, u))}</b></td><td>${esc(r.name)}</td><td>${esc(it.g)}</td><td><b>${esc(it.t)}</b>${[it.tags.join('、'), it.note].filter(Boolean).map(x => '<br>' + esc(x)).join('')}
          ${it.photos.length ? `<div class="rph">${it.photos.map(ph => `<img data-pid="${ph}">`).join('')}</div>` : ''}</td>
          <td class="sev-t s${it.sev}">${SEV[it.sev]}</td><td>${it.fixed ? '✔ 已改善' : '待改善'}</td></tr>`).join('')}</tbody></table>` : '<p>沒有缺失。</p>'}`;
  }
  app.innerHTML = `<div class="tabs noprint">
      <button class="${mode === 'units' ? 'on' : ''}" onclick="view.mode='units';render(true)">各戶進度</button>
      <button class="${mode === 'defects' ? 'on' : ''}" onclick="view.mode='defects';render(true)">缺失明細（派工）</button></div>
    <div class="card report"><h2>${esc(p.name)}　${mode === 'units' ? '各戶驗屋進度表' : '缺失明細表'}</h2>
      <div class="muted" style="margin-bottom:8px">列印日期：${today()}</div>${body}</div>`;
};

// ── 驗屋要領 ─────────────────────────────
VIEWS.guide = () => {
  setHeader('驗屋要領', true);
  app.innerHTML = `<div class="card"><b>📋 驗屋流程與心法</b><ol class="tips">${TIPS.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
    <div class="card"><b>🧰 要帶的工具</b><ul class="tools">${TOOLS.map(([a, b]) => `<li><b>${esc(a)}</b>：${esc(b)}</li>`).join('')}</ul></div>
    <div class="card muted">每個檢查項目旁邊的「?」有怎麼驗和參考標準。標準為業界常用值，實際以買賣合約與公司施工規範為準。</div>`;
};

// ── 備份 ─────────────────────────────────
const allUnits = () => state.projects.flatMap(p => p.floors.flatMap(f => f.units));
async function exportAll() {
  await saveNow();
  const photos = {};
  for (const u of allUnits()) for (const it of unitItems(u)) for (const ph of it.photos) photos[ph] = photoCache[ph] || await idbGet('photos', ph);
  const blob = new Blob([JSON.stringify({ app: 'home-inspection', ver: 2, state, photos })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `驗屋備份_${today()}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importAll(input) {
  const fl = input.files[0]; input.value = ''; if (!fl) return;
  try {
    const d = JSON.parse(await fl.text());
    if (d.app !== 'home-inspection' || !d.state || !Array.isArray(d.state.projects)) throw new Error('不是驗屋系統 v2 的備份檔');
    let add = 0;
    for (const p of d.state.projects) {
      if (state.projects.some(x => x.id === p.id)) continue;
      state.projects.push(p); add++;
      for (const f of p.floors) for (const u of f.units) for (const it of unitItems(u)) for (const ph of it.photos) if (d.photos && d.photos[ph]) await idbPut('photos', ph, d.photos[ph]);
    }
    save(); toast(`匯入 ${add} 個建案${d.state.projects.length - add ? `（${d.state.projects.length - add} 個已存在略過）` : ''}`); render();
  } catch (e) { toast('匯入失敗：' + e.message); }
}

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
}

// ── 啟動 ─────────────────────────────────
(async () => {
  try { state = (await idbGet('kv', 'state')) || { projects: [] }; }
  catch (e) { toast('讀取資料失敗：' + e.message); }
  if (!Array.isArray(state.projects)) state.projects = [];
  render(true);
  // 請瀏覽器不要在空間不足時自動清掉驗屋資料
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
})();
</script>
