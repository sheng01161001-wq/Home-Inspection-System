<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小棒槌 驗屋系統</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#16202c; --muted:#627080; --line:#d9e1ea;
  --accent:#e4572e; --accent-soft:#fdece6; --steel:#1f3a5f; --ok:#2b8a3e; --ok-soft:#e6f4ea;
  --warn:#d9480f; --na:#868e96;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.5;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:var(--steel);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font-size:16px;background:var(--steel);color:#fff;cursor:pointer;font-family:inherit}
.btn.accent{background:var(--accent)}
.btn.ghost{background:#fff;color:var(--steel);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.block{display:block;width:100%;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;margin:8px 0 4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:60px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list-item{display:flex;align-items:center;gap:12px;cursor:pointer}
.list-item .ic{font-size:28px;width:40px;text-align:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}
.badge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:13px;background:var(--line);color:var(--ink);margin-left:4px}
.badge.ng{background:var(--accent);color:#fff}
.badge.ok{background:var(--ok);color:#fff}
.badge.fix{background:#1971c2;color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:52px;z-index:5;background:var(--bg);padding:6px 0}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px;font-size:14px;font-family:inherit}
.tabs button.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.group-h{font-weight:bold;color:var(--steel);margin:16px 4px 6px;font-size:15px}
.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border-left:5px solid var(--line)}
.item.s-ok{border-left-color:var(--ok)}
.item.s-ng{border-left-color:var(--accent);background:#fffaf8}
.item.s-na{border-left-color:var(--na);opacity:.7}
.item.fixed{border-left-color:#1971c2}
.it-top{display:flex;gap:8px;align-items:flex-start}
.it-t{flex:1;font-weight:bold}
.info{border:1px solid var(--line);background:#fff;border-radius:50%;width:28px;height:28px;font-size:14px;color:var(--steel);flex:none}
.tip{background:#f3f6fa;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px;color:#33414f}
.sbtns{display:flex;gap:6px;margin-top:8px}
.sbtns button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;font-size:15px;font-family:inherit}
.sbtns .on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.sbtns .on-ng{background:var(--accent);color:#fff;border-color:var(--accent)}
.sbtns .on-na{background:var(--na);color:#fff;border-color:var(--na)}
.ngbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:14px;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sev1.on{background:#f59f00;border-color:#f59f00}
.chip.sev3.on{background:#c92a2a;border-color:#c92a2a}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;background:#ddd}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:22px;padding:0}
.addph{width:76px;height:76px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;color:var(--muted);cursor:pointer;background:#fff}
.addph input{display:none}
.fixbtn{margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat div{background:#f3f6fa;border-radius:8px;padding:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:70;font-size:14px}
ol.tips li,ul.tools li{margin-bottom:6px}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}

/* 建案樓層一覽 */
.stat5{grid-template-columns:repeat(5,1fr);gap:4px}
.stat5 div{font-size:12px;padding:6px 2px;white-space:nowrap}
.stat5 b{font-size:19px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12px}
.legend span{padding:2px 8px;border-radius:10px}
.floor{padding:8px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.floor .fn{width:46px;flex:none;font-weight:bold;font-size:16px;text-align:center;border:0;background:none;font-family:inherit;color:var(--steel);padding:4px 0}
.units{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.unit{border:0;border-radius:8px;padding:5px 2px;font-family:inherit;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.unit b{font-size:17px}.unit small{font-size:11px}
.u-none{background:#e9ecef;color:#495057}
.u-doing{background:#fff3bf;color:#7a5a00}
.u-ng{background:var(--accent);color:#fff}
.u-fixed{background:#d0ebff;color:#1864ab}
.u-ok{background:var(--ok);color:#fff}
.st{padding:1px 6px;border-radius:8px;font-size:12px;white-space:nowrap}
.lay{margin-bottom:6px;flex-wrap:nowrap;gap:4px;font-size:14px}.lay input{width:46px;padding:6px 4px}
.seg{margin-bottom:6px;gap:4px}.seg input[type=number]{width:62px;padding:6px}.seg .su{min-width:90px;padding:6px}
@media print{.st,.u-ng,.u-ok{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* 大類（可展開） */
.cat{background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.cat-h{display:flex;align-items:center;gap:6px;padding:14px;cursor:pointer;font-size:17px}
.cat.open .cat-h{background:#f3f6fa;border-bottom:1px solid var(--line)}
.cat-h .arrow{color:var(--muted);width:20px;text-align:center}
.cat-b{padding:10px 12px 14px}
.def-s{display:flex;align-items:center;gap:6px;padding:10px;margin-top:8px;border:1px solid #f3d3c8;border-radius:10px;background:#fffaf8;cursor:pointer;font-size:15px}
.def-s.is-fixed{border-color:#a5d8ff;background:#f3f9ff}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* 缺失處 */
.def{background:#fff;border:1px solid #f3d3c8;border-radius:10px;padding:10px;margin-top:8px}
.def.is-fixed{border-color:#a5d8ff;background:#f3f9ff}
.chip.type.on{background:#5f3dc4;border-color:#5f3dc4}
.chip.loc.on{background:var(--steel);border-color:var(--steel)}
.report h3{font-size:16px;margin:16px 0 6px;color:var(--steel)}
/* 報告 */
.report h2{font-size:20px;margin:0 0 4px}
.report table{width:100%;border-collapse:collapse;font-size:14px}
.report th,.report td{border:1px solid #bbb;padding:6px;vertical-align:top;text-align:left}
.report th{background:#eef2f7}
.report .rph{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.report .rph img{width:120px;height:90px;object-fit:cover;border:1px solid #ccc}
.sev-t{font-weight:bold;white-space:nowrap}
.sev-t.s3{color:#c92a2a}.sev-t.s2{color:var(--warn)}.sev-t.s1{color:#e67700}
.sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:24px}
.sign div{border-top:1px solid #333;padding-top:4px;font-size:14px;text-align:center}
@media print{
  header,.noprint{display:none!important}
  body{background:#fff;padding:0}
  main{max-width:none;padding:0}
  .card{box-shadow:none;padding:0}
  .report tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <button id="backBtn" onclick="goBack()" style="display:none">‹ 返回</button>
  <h1 id="title">小棒槌 驗屋系統</h1>
  <button id="hdrRight" style="display:none"></button>
</header>
<main id="app"></main>
<div id="layer"></div>

<script src="data.js"></script>
<script>
'use strict';
const VERSION = 'v8';

// ── 小工具 ─────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 本地日期 YYYY-MM-DD（toISOString 是 UTC，台灣早上 8 點前會變昨天）
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const num = (v, min, max) => Math.max(min, Math.min(max, parseInt(v, 10) || 0));


// ── 資料存取（全部放 IndexedDB，整個建案幾百戶也放得下）─────────
let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('home-inspection', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idbPut(store, key, val) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbGet(store, key) {
  const d = await db();
  return new Promise(res => { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
}
async function photoDel(id) {
  delete photoCache[id];
  const d = await db();
  return new Promise(res => { const t = d.transaction('photos', 'readwrite'); t.objectStore('photos').delete(id); t.oncomplete = res; t.onerror = res; });
}
let state = { projects: [] };
let saveTimer, saving = Promise.resolve();
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 200); }
function saveNow() {
  clearTimeout(saveTimer);
  saving = saving.then(() => idbPut('kv', 'state', state)).catch(e => toast('儲存失敗：' + e.message));
  return saving;
}
// 切走或關 App 時立刻存
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);

const photoCache = {};
async function hydratePhotos(root) {
  for (const img of (root || document).querySelectorAll('img[data-pid]')) {
    const id = img.dataset.pid;
    if (!photoCache[id]) photoCache[id] = await idbGet('photos', id);
    if (photoCache[id]) img.src = photoCache[id];
  }
}
// 壓縮照片：長邊 1280px、JPEG 品質 0.7
function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('讀不到照片')); };
    im.src = url;
  });
}

// ── 資料結構 ─────────────────────────────
// 建案 project { id, name, addr, layouts, floors:[floor] }
// 樓層 floor   { id, name, units:[unit] }
// 戶別 unit    { id, name, layout:{beds,baths,balc,common}, insp:null | insp }
// 驗屋 insp    { date, inspector, owner, phone, round, locs:[位置], checked:{工項:true}, defs:[缺失] }
// 缺失 def     { id, k:工項, cat:大類, type:種類, subs:[小項目], loc:位置, note, photos, fixed }（sev 嚴重程度已停用，舊資料留著不顯示）
// 只記缺失：沒記的就是合格。
const OTHER = { k: 'other', name: '其他', icon: '📌', cats: [] };
const tradeOf = k => TRADES.find(t => t.k === k) || OTHER;
const tradeOrder = (a, b) => { const i = k => { const n = TRADES.findIndex(t => t.k === k); return n < 0 ? 99 : n; }; return i(a) - i(b); };
const newDef = (k, cat) => ({ id: uid(), k, cat, type: '', subs: [], loc: '', note: '', photos: [], fixed: false });
// 空白缺失（什麼都沒選）不算數
const isEmptyDef = d => !d.type && !d.subs.length && !d.loc && !d.note && !d.photos.length;
const realDefs = I => I.defs.filter(d => !isEmptyDef(d));
// 這一戶要檢查的工項
const unitTrades = I => {
  const ks = TRADES.filter(t => !t.optional || I.common).map(t => t.k);
  realDefs(I).forEach(d => { if (!ks.includes(d.k)) ks.push(d.k); });
  return ks.sort(tradeOrder);
};
// 房間命名：兩房兩衛 → 主臥室、次臥室；兩房一衛 → 臥室1、臥室2；三房以上 → 主臥室、臥室1、臥室2…
function bedNames(beds, baths) {
  if (beds <= 0) return [];
  if (beds === 1) return ['臥室'];
  if (beds === 2) return baths >= 2 ? ['主臥室', '次臥室'] : ['臥室1', '臥室2'];
  return ['主臥室', ...Array.from({ length: beds - 1 }, (_, k) => '臥室' + (k + 1))];
}
// 兩衛 → 主衛浴室、次衛浴室
function bathNames(n) {
  if (n <= 0) return [];
  if (n === 1) return ['浴室'];
  return ['主衛浴室', '次衛浴室', ...Array.from({ length: n - 2 }, (_, k) => '浴室' + (k + 3))];
}
// 兩個陽台 → 前陽台、工作陽台；一個陽台 → 工作陽台
function balcNames(n) {
  if (n <= 0) return [];
  if (n === 1) return ['工作陽台'];
  return ['前陽台', '工作陽台', ...Array.from({ length: n - 2 }, (_, k) => '陽台' + (k + 3))];
}
const makeLocs = L => ['玄關', '客廳', '餐廳', '廚房', ...bedNames(L.beds, L.baths), ...bathNames(L.baths), ...balcNames(L.balc), '走道', '全戶'];

function stats(I) {
  const ds = realDefs(I), ks = unitTrades(I);
  return { def: ds.length, fixed: ds.filter(d => d.fixed).length, trades: ks.length, checked: ks.filter(k => I.checked[k]).length };
}
const unitPhotos = u => u.insp ? u.insp.defs.flatMap(d => d.photos) : [];
const unitLabel = (f, u) => `${f.name}-${u.name}`;
// 戶別狀態：未驗／驗屋中／有缺失／已改善／合格
// 第 1 次＝初驗，第 2 次＝複驗，之後第 2 次複驗…
const roundName = r => r <= 1 ? '初驗' : r === 2 ? '複驗' : `第 ${r - 1} 次複驗`;
const roundDone = I => (I.done || {})[I.round];
// 這一輪還沒按「完成」→ 黃色驗屋中；按了完成 → 有待改善紅色、全部改好藍色、沒缺失綠色
function unitStatus(u) {
  if (!u.insp) return { k: 'none', t: '未驗' };
  const I = u.insp, s = stats(I), open = s.def - s.fixed, rn = roundName(I.round);
  if (!roundDone(I)) return { k: 'doing', t: open ? `${rn}中 缺${open}` : `${rn}中`, s };
  if (open > 0) return { k: 'ng', t: `待改善 ${open}`, s };
  if (s.def) return { k: 'fixed', t: '已改善', s };
  return { k: 'ok', t: '合格', s };
}
// 舊版紀錄轉成新版（只記缺失）：舊缺失放在原工項（或「其他」）的「舊版紀錄」大類
function migrateUnit(u) {
  const old = u.insp; if (!old || old.defs) return;
  const locs = old.locs ? [...old.locs] : makeLocs(u.layout), defs = [];
  const add = (k, t, d, loc) => {
    if (loc && !locs.includes(loc)) locs.push(loc);
    defs.push({ id: uid(), k, cat: '舊版紀錄', subs: [t, ...(d.tags || [])], loc: loc || '', sev: d.sev || 2, note: d.note || '', photos: d.photos || [], fixed: !!d.fixed });
  };
  if (old.rooms) old.rooms.forEach(r => r.items.forEach(it => { if (it.s === 'ng') add('other', it.t, it, r.name); }));
  if (old.items) old.items.forEach(it => { if (it.s === 'ng') it.defs.forEach(d => add(it.k, it.t, d, d.loc)); });
  u.insp = { date: old.date, inspector: old.inspector, owner: old.owner, phone: old.phone, round: old.round || 1, common: !!u.layout.common, locs, checked: {}, defs };
}
// 樓層名稱 → 數字（B1 = -1、RF／屋突 = 999、看不懂的 = 0）
const floorNum = n => { if (/^(R|屋)/i.test(n)) return 999; const m = /^B(\d+)/i.exec(n); if (m) return -parseInt(m[1], 10); const k = parseInt(n, 10); return isNaN(k) ? 0 : k; };
// 高樓層在上；B1、B2 在最下面
const floorSort = (a, b) => floorNum(b.name) - floorNum(a.name);

// ── 畫面切換 ─────────────────────────────
let view = { name: 'home' };
const stack = [];
const app = document.getElementById('app');
// 每換一頁寫一筆瀏覽器歷史，手機返回鍵／手勢才會回上一頁而不是跳出 App
function go(v) { stack.push(view); view = v; history.pushState({ d: stack.length }, ''); render(true); }
function goBack() { if (stack.length) history.back(); else { view = { name: 'home' }; render(true); } }
window.addEventListener('popstate', () => {
  const l = document.getElementById('layer');
  if (l.innerHTML) { l.innerHTML = ''; history.pushState({ d: stack.length }, ''); return; } // 先關掉彈出視窗
  view = stack.pop() || { name: 'home' }; render(true);
});
const curP = () => state.projects.find(p => p.id === view.pid);
const curF = () => { const p = curP(); return p && p.floors.find(f => f.id === view.fid); };
const curU = () => { const f = curF(); return f && f.units.find(u => u.id === view.uid); };

function setHeader(title, back, right) {
  document.getElementById('title').textContent = title;
  document.getElementById('backBtn').style.display = back ? '' : 'none';
  const b = document.getElementById('hdrRight');
  if (right) { b.style.display = ''; b.textContent = right[0]; b.onclick = right[1]; } else b.style.display = 'none';
}
const VIEWS = {};
function render(top) {
  const y = window.scrollY;
  (VIEWS[view.name] || VIEWS.home)();
  hydratePhotos(app);
  window.scrollTo(0, top ? 0 : y);
}
// 找不到資料（被刪了）就回首頁
function lost() { view = { name: 'home' }; stack.length = 0; VIEWS.home(); }

// ── 首頁：建案列表 ─────────────────────────
VIEWS.home = () => {
  setHeader('小棒槌 驗屋系統', false, ['📘 驗屋要領', () => go({ name: 'guide' })]);
  let h = `<button class="btn accent block" onclick="go({name:'newProject'})">＋ 新增建案</button><div style="height:12px"></div>`;

    h += `<div class="card list-item" onclick="go({name:'project',pid:'${p.id}'})">
      <div class="ic">🏢</div>

        <div class="bar"><i style="width:${units.length ? done / units.length * 100 : 0}%"></i></div>

    <div class="row" style="margin-top:8px"><button class="btn ghost small" onclick="exportAll()">匯出備份</button>
    <label class="btn ghost small">匯入備份<input type="file" accept=".json,application/json" style="display:none" onchange="importAll(this)"></label></div></div>
    <div class="ver">版本 ${VERSION}</div>`;
  app.innerHTML = h;
};

function segRow(from, to, units) {
  return `<div class="seg row"><input type="number" class="sf" value="${esc(from)}"> F ～ <input type="number" class="st2" value="${esc(to)}"> F
    <input type="text" class="su grow" value="${esc(units)}" oninput="drawLayouts()" placeholder="A,B,C">
    <button class="btn ghost small" onclick="this.parentNode.remove();drawLayouts()" title="刪除這段">✕</button></div>`;
}
function addSeg() {
  const rows = [...document.querySelectorAll('#p_segs .seg')], last = rows[rows.length - 1];
  const to = last ? parseInt(last.querySelector('.st2').value, 10) || 1 : 1;
  const units = last ? last.querySelector('.su').value : 'A,B';
  document.getElementById('p_segs').insertAdjacentHTML('beforeend', segRow(to + 1, to + 4, units));
  drawLayouts();
}
const readSegs = () => [...document.querySelectorAll('#p_segs .seg')].map(r => ({
  from: parseInt(r.querySelector('.sf').value, 10), to: parseInt(r.querySelector('.st2').value, 10), units: parseUnits(r.querySelector('.su').value) }));
const parseUnits = s => [...new Set(s.split(/[,，、\s]+/).map(x => x.trim()).filter(Boolean))].slice(0, 30);
function drawLayouts() {
  const box = document.getElementById('p_layouts');
  const old = {};
  box.querySelectorAll('[data-u]').forEach(r => { old[r.dataset.u] = [...r.querySelectorAll('input')].map(i => i.value); });
  box.innerHTML = [...new Set(readSegs().flatMap(g => g.units))].map(u => {
    const v = old[u] || [3, 2, 2];
    return `<div class="row lay" data-u="${esc(u)}"><b style="width:44px">${esc(u)} 戶</b>
      <input type="number" value="${esc(v[0])}" min="0" max="8"> 房 <input type="number" value="${esc(v[1])}" min="0" max="6"> 衛 <input type="number" value="${esc(v[2])}" min="0" max="5"> 陽台</div>`;
  }).join('');
}
function createProject() {
  const v = id => document.getElementById(id).value.trim();
  if (!v('p_name')) { toast('請填建案名稱'); return; }
  const segs = readSegs();
  if (!segs.length) { toast('請至少設一段樓層'); return; }
  const byFloor = new Map();
  for (const g of segs) {
    if (isNaN(g.from) || isNaN(g.to) || g.to < g.from || g.to - g.from > 80) { toast(`樓層範圍不對：${g.from}～${g.to}F`); return; }
    if (!g.units.length) { toast(`${g.from}～${g.to}F 沒填戶別`); return; }
    for (let k = g.from; k <= g.to; k++) {
      if (k === 0) continue;
      if (byFloor.has(k)) { toast(`樓層重複：${k > 0 ? k + 'F' : 'B' + (-k)} 在兩段裡都有`); return; }
      byFloor.set(k, g.units);
    }
  }
  const layouts = {};
  document.querySelectorAll('#p_layouts [data-u]').forEach(r => {
    const n = [...r.querySelectorAll('input')].map(i => i.value);
    layouts[r.dataset.u] = { beds: num(n[0], 0, 8), baths: num(n[1], 0, 6), balc: num(n[2], 0, 5), common: document.getElementById('p_common').checked };
  });
  const floors = [...byFloor.keys()].sort((a, b) => b - a).map(k => ({ id: uid(), name: k > 0 ? k + 'F' : 'B' + (-k),
    units: byFloor.get(k).map(n => ({ id: uid(), name: n, layout: { ...layouts[n] }, insp: null })) }));
  const p = { id: uid(), name: v('p_name'), addr: v('p_addr'), layouts, floors, created: Date.now() };
  state.projects.unshift(p); save();
  stack.pop(); view = { name: 'project', pid: p.id }; history.replaceState({ d: stack.length }, ''); stack.push({ name: 'home' }); render(true);
}

      <div><b>${units.length}</b>總戶</div><div><b style="color:var(--ok)">${cnt.ok + cnt.fixed}</b>完成</div>
      <div><b style="color:var(--accent)">${cnt.ng}</b>缺失</div><div><b style="color:#e67700">${cnt.doing}</b>驗中</div><div><b>${cnt.none}</b>未驗</div></div>
    <div class="muted" style="margin-top:8px;font-size:13px">點戶別進去驗屋；點樓層名稱可新增／刪除戶別。</div><div class="legend"><span class="u-none">未驗</span><span class="u-doing">驗屋中</span><span class="u-ng">待改善</span><span class="u-fixed">已改善</span><span class="u-ok">合格</span></div></div>`;
  [...p.floors].sort(floorSort).forEach(f => {
    h += `<div class="card floor"><button class="fn" onclick="floorMenu('${f.id}')" title="樓層設定">${esc(f.name)}<br><small style="font-weight:normal;color:var(--muted)">⋯</small></button><div class="units">`;
    f.units.forEach(u => {
      const st = unitStatus(u);
      h += `<button class="unit u-${st.k}" onclick="go({name:'unit',pid:'${p.id}',fid:'${f.id}',uid:'${u.id}'})"><b>${esc(u.name)}</b><small>${st.t}</small></button>`;
    });
    h += `</div></div>`;
  });
  h += `<div class="card noprint">
    <button class="btn ghost block" onclick="addFloor()">＋ 新增樓層（1F、B1…）</button>
    <button class="btn ghost block" onclick="batchSheet()">🏗 調整某幾層的戶別（退縮、合併戶）</button>
    <button class="btn ghost block" onclick="editProject()">✏️ 修改建案資料</button>
    <button class="btn ghost block" style="color:var(--accent)" onclick="delProject()">🗑 刪除這個建案</button></div>`;
  app.innerHTML = h;
};
function batchSheet() {
  sheet(`<b>調整某幾層的戶別</b>
    <div class="muted">例：11～14F 只剩 A,B → 這幾層會變成只有 A、B 兩戶（缺的戶自動補上，多的戶刪掉）。</div>
    <div class="row" style="margin-top:8px"><input type="number" id="b_from" style="width:80px"> F ～ <input type="number" id="b_to" style="width:80px"> F</div>
    <label class="f">這幾層的戶別</label><input type="text" id="b_units" placeholder="A,B">
    <button class="btn accent block" onclick="batchApply()">套用</button><button class="btn ghost block" onclick="closeSheet()">取消</button>`);
}
async function batchApply() {
  const p = curP(), from = parseInt(document.getElementById('b_from').value, 10), to = parseInt(document.getElementById('b_to').value, 10);
  const names = parseUnits(document.getElementById('b_units').value);
  if (isNaN(from) || isNaN(to) || to < from) { toast('樓層範圍不對'); return; }
  if (!names.length) { toast('請填戶別'); return; }
  const floors = p.floors.filter(f => { const k = floorNum(f.name); return k >= from && k <= to && k !== 0 && k !== 999; });
  if (!floors.length) { toast('這個範圍沒有樓層'); return; }
  const drop = floors.flatMap(f => f.units.filter(u => !names.includes(u.name)).map(u => ({ f, u })));
  const kept = drop.filter(x => x.u.insp);
  const msg = `${floors.map(f => f.name).sort((a, b) => floorNum(a) - floorNum(b)).join('、')} 改成 ${names.join('、')}。`
    + (drop.length - kept.length ? `\n會刪掉 ${drop.length - kept.length} 戶（還沒驗屋的）。` : '')
    + (kept.length ? `\n${kept.map(x => unitLabel(x.f, x.u)).join('、')} 已經有驗屋紀錄，會保留不刪。` : '');
  if (!confirm(msg + '\n\n確定套用？')) return;
  for (const f of floors) {
    const old = f.units;
    f.units = names.map(n => old.find(u => u.name === n) || { id: uid(), name: n, layout: { ...(p.layouts[n] || { beds: 3, baths: 2, balc: 2, common: false }) }, insp: null })
      .concat(old.filter(u => !names.includes(u.name) && u.insp));
  }
  save(); closeSheet(); render(); toast('已調整');
}
function addFloor() {
  const p = curP();
  const n = prompt('樓層名稱（例：1F、B1、RF）'); if (!n || !n.trim()) return;
  if (p.floors.some(f => f.name === n.trim())) { toast('已經有這個樓層'); return; }
  const us = prompt('這層的戶別（逗號分開）', Object.keys(p.layouts).join(',')); if (us === null) return;
  const units = parseUnits(us).map(x => ({ id: uid(), name: x, layout: { ...(p.layouts[x] || { beds: 3, baths: 2, balc: 2, common: false }) }, insp: null }));
  p.floors.push({ id: uid(), name: n.trim(), units }); save(); render();
}
function floorMenu(fid) {
  const f = curP().floors.find(x => x.id === fid);
  sheet(`<b>${esc(f.name)}</b>
    <button class="btn ghost block" onclick="addUnit('${fid}')">＋ 新增戶別</button>
    <button class="btn ghost block" onclick="renameFloor('${fid}')">✏️ 改樓層名稱</button>
    <button class="btn ghost block" onclick="delUnitSheet('${fid}')">🗑 刪除某一戶</button>
    <button class="btn ghost block" style="color:var(--accent)" onclick="delFloor('${fid}')">🗑 刪除整層</button>
    <button class="btn block" onclick="closeSheet()">取消</button>`);
}
function addUnit(fid) {
  const p = curP(), f = p.floors.find(x => x.id === fid);
  const n = prompt('戶別名稱（例：D）'); if (!n || !n.trim()) return;
  if (f.units.some(u => u.name === n.trim())) { toast('這層已經有這一戶'); return; }
  f.units.push({ id: uid(), name: n.trim(), layout: { ...(p.layouts[n.trim()] || { beds: 3, baths: 2, balc: 2, common: false }) }, insp: null });
  save(); closeSheet(); render();
}
function renameFloor(fid) {
  const f = curP().floors.find(x => x.id === fid);
  const n = prompt('樓層名稱', f.name); if (n && n.trim()) { f.name = n.trim(); save(); } closeSheet(); render();
}
async function delPhotosOf(units) { for (const u of units) for (const ph of unitPhotos(u)) await photoDel(ph); }
function delUnitSheet(fid) {
  const f = curP().floors.find(x => x.id === fid);
  sheet(`<b>刪除 ${esc(f.name)} 的哪一戶？</b>${f.units.map(u => `<button class="btn ghost block" onclick="delUnit('${fid}','${u.id}')">${esc(u.name)}（${unitStatus(u).t}）</button>`).join('')}
    <button class="btn block" onclick="closeSheet()">取消</button>`);
}
async function delUnit(fid, id) {
  const f = curP().floors.find(x => x.id === fid), u = f.units.find(x => x.id === id);
  if (!confirm(`刪除 ${unitLabel(f, u)} 和它所有的驗屋紀錄、照片？`)) return;
  await delPhotosOf([u]); f.units = f.units.filter(x => x !== u); save(); closeSheet(); render();
}
async function delFloor(fid) {
  const p = curP(), f = p.floors.find(x => x.id === fid);
  if (!confirm(`刪除整個 ${f.name}（${f.units.length} 戶）和所有驗屋紀錄、照片？`)) return;
  await delPhotosOf(f.units); p.floors = p.floors.filter(x => x !== f); save(); closeSheet(); render();
}
function editProject() {
  const p = curP();
  sheet(`<b>修改建案資料</b>
    <label class="f">建案名稱</label><input type="text" id="e_name" value="${esc(p.name)}">
    <label class="f">地址</label><input type="text" id="e_addr" value="${esc(p.addr)}">
    <button class="btn accent block" onclick="saveProject()">儲存</button><button class="btn ghost block" onclick="closeSheet()">取消</button>`);
}
function saveProject() {
  const p = curP(), v = id => document.getElementById(id).value.trim();
  p.name = v('e_name') || p.name; p.addr = v('e_addr'); save(); closeSheet(); render();
}
async function delProject() {
  const p = curP();
  if (!confirm(`刪除建案「${p.name}」？所有樓層、戶別的驗屋紀錄和照片都會刪掉，無法復原。\n（建議先回首頁匯出備份）`)) return;
  if (prompt('確定要刪除請輸入建案名稱') !== p.name) { toast('名稱不符，沒有刪除'); return; }
  await delPhotosOf(p.floors.flatMap(f => f.units));
  state.projects = state.projects.filter(x => x !== p); save(); lost();
}

VIEWS.unit = () => {
  const p = curP(), f = curF(), u = curU(); if (!u) return lost();
  const label = unitLabel(f, u);
  if (!u.insp) {
    setHeader(`${label} 戶`, true);
    const L = u.layout;
    app.innerHTML = `<div class="card"><b>${esc(p.name)}　${esc(label)}</b><div class="muted">這一戶還沒驗屋</div>
      <label class="f">住戶姓名</label><input type="text" id="i_owner">
      <label class="f">住戶電話</label><input type="text" id="i_phone" inputmode="tel">
      <div class="row"><div class="grow"><label class="f">驗屋日期</label><input type="date" id="i_date" value="${today()}"></div>
      <div class="grow"><label class="f">陪驗人員</label><input type="text" id="i_insp" value="${esc(state.lastInspector || '')}"></div></div>
      <label class="f">格局</label>
      <div class="grid3">
        <div><div class="muted">房間數</div><input type="number" id="i_beds" value="${L.beds}" min="0" max="8" oninput="previewLocs()"></div>
        <div><div class="muted">衛浴數</div><input type="number" id="i_baths" value="${L.baths}" min="0" max="6" oninput="previewLocs()"></div>
        <div><div class="muted">陽台數</div><input type="number" id="i_balc" value="${L.balc}" min="0" max="5" oninput="previewLocs()"></div>
      </div>
      <div class="muted" id="i_locs" style="margin-top:6px"></div>
      <label class="row" style="margin-top:10px"><input type="checkbox" id="i_common" ${L.common ? 'checked' : ''}> 包含公設與停車位檢查</label>
      <button class="btn accent block" onclick="startInsp()">開始驗屋</button></div>`;
    previewLocs();
    return;
  }
  const I = u.insp;
  if (I.defs.some(isEmptyDef)) { I.defs = I.defs.filter(d => !isEmptyDef(d)); save(); } // 離開工項時，什麼都沒選的空白缺失自動丟掉
  openDefs.clear();
  setHeader(`${label} 戶`, true, ['📋 報告', () => go({ ...view, name: 'report' })]);
  const s = stats(I);
  let h = `<div class="card"><div class="stat">
      <div><b>${s.checked}/${s.trades}</b>工項完成</div><div><b style="color:var(--accent)">${s.def - s.fixed}</b>待改善</div>
      <div><b style="color:#1971c2">${s.fixed}</b>已改善</div><div><b>${s.def}</b>缺失合計</div></div>
      <div class="muted" style="margin-top:8px">${esc(p.name)} ${esc(label)}　住戶：${esc(I.owner || '—')} ${esc(I.phone || '')}<br>
      ${esc(I.date || '')}　陪驗：${esc(I.inspector || '—')}　<b>${roundName(I.round)}${roundDone(I) ? '（已完成）' : '（進行中）'}</b></div>
      <div class="muted" style="margin-top:6px">📍 位置：${I.locs.map(esc).join('、')} <a href="javascript:editLocs()">修改</a></div></div>`;
  unitTrades(I).forEach(k => {
    const tr = tradeOf(k), ds = realDefs(I).filter(d => d.k === k), fixed = ds.filter(d => d.fixed).length, open = ds.length - fixed;
    h += `<div class="card list-item" onclick="go({...view,name:'trade',tk:'${k}'})">
      <div class="ic">${tr.icon}</div>
      <div class="grow"><b>${esc(tr.name)}</b>
        ${open ? `<span class="badge ng">缺失 ${open}</span>` : ''}${fixed ? `<span class="badge fix">改善 ${fixed}</span>` : ''}
        <div class="muted">${I.checked[k] ? '✔ 檢查完成' : '未完成'}</div></div>
      <div class="chk ${I.checked[k] ? 'on' : ''}">✔</div></div>`;
  });
  h += `<div class="card noprint">
    <button class="btn ghost block" onclick="editInsp()">✏️ 修改住戶／驗屋資料</button>
    ${roundDone(I)
      ? `<button class="btn ghost block" onclick="undoFinish()">✔ ${roundName(I.round)}已完成（${esc(roundDone(I))}）・點這裡取消</button>
         <button class="btn accent block" onclick="startRecheck()">🔁 開始${roundName(I.round + 1)}</button>`
      : `<button class="btn accent block" onclick="finishRound()">✔ 完成${roundName(I.round)}</button>`}
    <button class="btn ghost block" style="color:var(--accent)" onclick="clearInsp()">🗑 清除這戶的驗屋紀錄</button></div>`;
  app.innerHTML = h;
};
function layoutFromForm() {
  const v = id => document.getElementById(id).value.trim();
  return { beds: num(v('i_beds'), 0, 8), baths: num(v('i_baths'), 0, 6), balc: num(v('i_balc'), 0, 5), common: document.getElementById('i_common').checked };
}
function previewLocs() { document.getElementById('i_locs').textContent = '位置：' + makeLocs(layoutFromForm()).join('、'); }
function startInsp() {
  const u = curU(), v = id => document.getElementById(id).value.trim();
  u.layout = layoutFromForm();
  u.insp = { date: v('i_date'), inspector: v('i_insp'), owner: v('i_owner'), phone: v('i_phone'), round: 1, common: u.layout.common, locs: makeLocs(u.layout), checked: {}, defs: [] };
  if (v('i_insp')) state.lastInspector = v('i_insp');
  save(); render(true);
}
function editLocs() {
  const I = curU().insp;
  const n = prompt('這一戶的位置（用頓號或逗號分開，可加書房、儲藏室…）', I.locs.join('、'));
  if (n === null) return;
  const locs = parseUnits(n);
  if (!locs.length) { toast('至少要有一個位置'); return; }
  I.locs = locs; save(); render();
}
function editInsp() {
  const I = curU().insp;
  sheet(`<b>修改住戶／驗屋資料</b>
    <label class="f">住戶姓名</label><input type="text" id="e_owner" value="${esc(I.owner)}">
    <label class="f">住戶電話</label><input type="text" id="e_phone" value="${esc(I.phone)}">
    <label class="f">驗屋日期</label><input type="date" id="e_date" value="${esc(I.date)}">
    <label class="f">陪驗人員</label><input type="text" id="e_insp" value="${esc(I.inspector)}">
    <label class="row" style="margin-top:10px"><input type="checkbox" id="e_common" ${I.common ? 'checked' : ''}> 包含公設與停車位檢查</label>
    <button class="btn accent block" onclick="saveInsp()">儲存</button><button class="btn ghost block" onclick="closeSheet()">取消</button>`);
}
function saveInsp() {
  const I = curU().insp, v = id => document.getElementById(id).value.trim();
  I.owner = v('e_owner'); I.phone = v('e_phone'); I.date = v('e_date'); I.inspector = v('e_insp'); I.common = document.getElementById('e_common').checked;
  save(); closeSheet(); render();
}
function finishRound() {
  const I = curU().insp, s = stats(I), rn = roundName(I.round), open = s.def - s.fixed;
  const left = s.trades - s.checked;
  if (!confirm(`確定完成${rn}？

${left ? `還有 ${left} 個工項沒按「檢查完成」，沒記缺失的都會算合格。
` : ''}待改善缺失：${open} 處`)) return;
  unitTrades(I).forEach(k => { I.checked[k] = true; });
  I.done = I.done || {}; I.done[I.round] = today(); save();
  toast(open ? `${rn}完成，待改善 ${open} 處。改善好後按「開始${roundName(I.round + 1)}」` : `${rn}完成，全部合格 👍`);
  render();
}
function undoFinish() {
  const I = curU().insp;
  if (!confirm(`取消「${roundName(I.round)}已完成」，回到進行中？`)) return;
  delete I.done[I.round]; save(); render();
}
function startRecheck() {
  const I = curU().insp;
  if (!confirm(`開始${roundName(I.round + 1)}？\n\n缺失會保留，到現場逐處確認後按「已改善」，看完按「完成${roundName(I.round + 1)}」。驗屋日期會改成今天。`)) return;
  I.round++; I.date = today(); I.checked = {}; save();
  toast('已進入複驗，到各工項逐處確認'); render();
}
async function clearInsp() {
  const f = curF(), u = curU();
  if (!confirm(`清除 ${unitLabel(f, u)} 的驗屋紀錄和照片，回到「未驗」？無法復原。`)) return;
  await delPhotosOf([u]); u.insp = null; save(); render(true);
}

// ── 工項：大類（可展開／收起）→ 缺失 ─────────────
const openCats = new Set(), openDefs = new Set(), openTips = new Set();
VIEWS.trade = () => {
  const f = curF(), u = curU(); if (!u || !u.insp) return lost();
  const I = u.insp, tr = tradeOf(view.tk);
  // 收起來的空白缺失丟掉
  I.defs = I.defs.filter(d => !isEmptyDef(d) || openDefs.has(d.id));
  setHeader(`${unitLabel(f, u)}｜${tr.name}`, true);
  const mine = I.defs.filter(d => d.k === view.tk);
  const cats = [...tr.cats];
  mine.forEach(d => { if (!cats.some(x => x.n === d.cat)) cats.push({ n: d.cat, h: '', s: [] }); });
  let h = `<div class="muted" style="margin:0 4px 8px">沒記缺失就是合格。點大類打開 →「＋ 新增缺失」→ 選小項目和位置。</div>`;
  cats.forEach((ct, ci) => {
    const key = view.tk + '|' + ct.n, open = openCats.has(key);
    const ds = mine.filter(d => d.cat === ct.n), real = ds.filter(d => !isEmptyDef(d)), openN = real.filter(d => !d.fixed).length;
    h += `<div class="cat ${open ? 'open' : ''}">
      <div class="cat-h" onclick="toggleCat(${ci})"><b class="grow">${esc(ct.n)}</b>
        ${openN ? `<span class="badge ng">缺失 ${openN}</span>` : ''}${real.length - openN ? `<span class="badge fix">改善 ${real.length - openN}</span>` : ''}
        <span class="arrow">${open ? '▾' : '▸'}</span></div>`;
    if (open) {
      h += `<div class="cat-b">`;
      if (ct.h) h += `<div class="tip">💡 ${esc(ct.h)}</div>`;
      ds.forEach((d, n) => { h += defHTML(d, n, ct, I, tr); });
      h += `<button class="btn accent small" style="margin-top:8px" onclick="addDef(${ci})">＋ 新增缺失</button></div>`;
    }
    h += `</div>`;
  });
  h += `<button class="btn block ${I.checked[view.tk] ? '' : 'ghost'}" style="margin-top:12px" onclick="toggleChecked()">${I.checked[view.tk] ? '✔ 這個工項檢查完成（點一下取消）' : '這個工項檢查完成'}</button>`;
  app.innerHTML = h;
  view.cats = cats.map(x => x.n);
};
function defHTML(d, n, ct, I, tr) {
  const a = `'${d.id}'`;
  const sum = [d.loc, d.type, d.subs.join('、')].filter(Boolean).join('｜') || '（還沒選）';
  if (!openDefs.has(d.id)) {
    return `<div class="def-s ${d.fixed ? 'is-fixed' : ''}" onclick="toggleDef(${a})">
      <span class="grow">${n + 1}. ${esc(sum)}${d.note ? '　' + esc(d.note) : ''}</span>
      ${d.photos.length ? `<span class="muted">📷${d.photos.length}</span>` : ''}
      ${d.fixed ? '<span class="badge fix">已改善</span>' : ''}</div>`;
  }
  const subs = [...ct.s]; d.subs.forEach(x => { if (!subs.includes(x)) subs.push(x); });
  return `<div class="ngbox def ${d.fixed ? 'is-fixed' : ''}">
    <div class="row"><b class="grow">第 ${n + 1} 處</b>
      <button class="btn ghost small" onclick="toggleDef(${a})">收起</button>
      <button class="btn ghost small" style="color:var(--accent)" onclick="delDef(${a})">刪除</button></div>
    ${ct.t && ct.t.length ? `<div class="muted">種類</div><div class="chips">${ct.t.map((x, k) =>
      `<button class="chip type ${d.type === x ? 'on' : ''}" onclick="setType(${a},${k})">${esc(x)}</button>`).join('')}</div>` : ''}
    <div class="muted">小項目（可複選）</div>
    <div class="chips">${subs.map((x, k) => `<button class="chip ${d.subs.includes(x) ? 'on' : ''}" onclick="toggleSub(${a},${k})">${esc(x)}</button>`).join('')}</div>
    ${tr.noLoc ? '' : `<div class="muted">位置</div><div class="chips">${I.locs.map((l, k) =>
      `<button class="chip loc ${d.loc === l ? 'on' : ''}" onclick="setLoc(${a},${k})">${esc(l)}</button>`).join('')}</div>`}
    <textarea placeholder="補充說明（例：靠窗左側第 3 塊、裂縫約 0.3 mm）" oninput="setNote(${a},this.value)">${esc(d.note)}</textarea>
    <div class="photos">${d.photos.map(ph => `<div class="ph"><img data-pid="${ph}" onclick="viewPhoto('${ph}')"><button onclick="delPhoto(${a},'${ph}')">✕</button></div>`).join('')}
      <label class="addph">📷<span>拍照</span><input type="file" accept="image/*" capture="environment" onchange="addPhoto(${a},this)"></label>
      <label class="addph">🖼️<span>相簿</span><input type="file" accept="image/*" multiple onchange="addPhoto(${a},this)"></label></div>
    ${I.round > 1 || d.fixed ? `<button class="btn small fixbtn ${d.fixed ? '' : 'ghost'}" onclick="toggleFixed(${a})">${d.fixed ? '✔ 複驗：已改善' : '複驗：標為已改善'}</button>` : ''}
  </div>`;
}
const findDef = id => curU().insp.defs.find(d => d.id === id);
const catDef = n => tradeOf(view.tk).cats.find(x => x.n === n) || { s: [] };
function toggleCat(ci) { const key = view.tk + '|' + view.cats[ci]; openCats.has(key) ? openCats.delete(key) : openCats.add(key); render(); }
function toggleDef(id) { openDefs.has(id) ? openDefs.delete(id) : openDefs.add(id); render(); }
function addDef(ci) {
  const d = newDef(view.tk, view.cats[ci]); curU().insp.defs.push(d); openDefs.add(d.id); save(); render();
}
async function delDef(id) {
  const I = curU().insp, d = findDef(id);
  if (!isEmptyDef(d) && !confirm('刪除這一處缺失（含照片）？')) return;
  for (const ph of d.photos) await photoDel(ph);
  I.defs = I.defs.filter(x => x !== d); openDefs.delete(id); save(); render();
}
function toggleSub(id, k) {
  const d = findDef(id), subs = [...catDef(d.cat).s]; d.subs.forEach(x => { if (!subs.includes(x)) subs.push(x); });
  const x = subs[k], i = d.subs.indexOf(x); i < 0 ? d.subs.push(x) : d.subs.splice(i, 1); save(); render();
}
function setLoc(id, k) { const d = findDef(id), l = curU().insp.locs[k]; d.loc = d.loc === l ? '' : l; save(); render(); }
function setType(id, k) { const d = findDef(id), x = catDef(d.cat).t[k]; d.type = d.type === x ? '' : x; save(); render(); }
function setNote(id, v) { findDef(id).note = v; save(); }
function toggleFixed(id) { const d = findDef(id); d.fixed = !d.fixed; save(); render(); }
function toggleChecked() { const I = curU().insp; I.checked[view.tk] = !I.checked[view.tk]; save(); render(); }
async function addPhoto(id, input) {
  const d = findDef(id);
  const files = [...input.files]; input.value = '';
  for (const fl of files) {
    try { const data = await compress(fl); const pid = uid(); await idbPut('photos', pid, data); photoCache[pid] = data; d.photos.push(pid); }
    catch (e) { toast('照片儲存失敗：' + e.message); }
  }
  save(); render();
}
async function delPhoto(id, pid) {
  if (!confirm('刪除這張照片？')) return;
  const d = findDef(id); d.photos = d.photos.filter(x => x !== pid); save(); await photoDel(pid); render();
}
function viewPhoto(pid) {
  document.getElementById('layer').innerHTML = `<div class="viewer" onclick="this.remove()"><img src="${photoCache[pid] || ''}"></div>`;
}

// ── 彈出視窗 ─────────────────────────────
function sheet(html) { document.getElementById('layer').innerHTML = `<div class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`; }
function closeSheet() { document.getElementById('layer').innerHTML = ''; }

// ── 單戶驗屋報告（依工項分組，方便直接交給廠商）─────
const defDesc = d => `<b>${esc(d.cat)}${d.type ? '（' + esc(d.type) + '）' : ''}</b>${d.subs.length ? '：' + esc(d.subs.join('、')) : ''}${d.note ? '<br>' + esc(d.note) : ''}
  ${d.photos.length ? `<div class="rph">${d.photos.map(ph => `<img data-pid="${ph}">`).join('')}</div>` : ''}`;
VIEWS.report = () => {
  const p = curP(), f = curF(), u = curU(); if (!u || !u.insp) return lost();
  const I = u.insp, label = unitLabel(f, u);
  setHeader(`${label} 驗屋報告`, true, ['🖨 列印／PDF', () => window.print()]);
  const s = stats(I), ds = realDefs(I);
  let n = 0, body = '';
  [...new Set(ds.map(d => d.k))].sort(tradeOrder).forEach(k => {
    const list = ds.filter(d => d.k === k), tr = tradeOf(k);
    body += `<h3>${tr.icon} ${esc(tr.name)}（${list.length} 處）</h3>
      <table><thead><tr><th>#</th><th>位置</th><th>缺失內容</th><th>狀態</th></tr></thead><tbody>${list.map(d =>
        `<tr><td>${++n}</td><td>${esc(d.loc || '—')}</td><td>${defDesc(d)}</td><td>${d.fixed ? '✔ 已改善' : '待改善'}</td></tr>`).join('')}</tbody></table>`;
  });
  const todo = s.trades - s.checked;
  app.innerHTML = `<div class="card report">
    <h2>住戶驗屋缺失紀錄表</h2>
    <div>建案：${esc(p.name)}　戶別：<b>${esc(label)}</b><br>地址：${esc(p.addr || '—')}<br>
      住戶：${esc(I.owner || '—')}　${esc(I.phone || '')}<br>驗屋日期：${esc(I.date || '—')}（${roundName(I.round)}${roundDone(I) ? '' : '，進行中'}）　陪驗人員：${esc(I.inspector || '—')}</div>
    <p><b>缺失共 ${s.def} 處</b>${s.fixed ? `，其中已改善 ${s.fixed} 處` : ''}；未列出的項目皆為合格。
      ${todo ? `<span class="noprint" style="color:var(--accent)">（還有 ${todo} 個工項沒按「檢查完成」）</span>` : ''}</p>
    ${n ? body : '<p>本次檢查無缺失。</p>'}
    <p style="font-size:14px;margin-top:16px">以上缺失經雙方現場確認，本公司將於　　年　　月　　日前改善完成，並通知住戶複驗。</p>
    <div class="sign"><div>住戶簽名</div><div>公司陪驗人員</div><div>日期</div></div>
  </div>
  <div class="card noprint muted">按右上「列印／PDF」，印表機選「另存為 PDF」就能存成 PDF。手機 Chrome：右上選單 → 分享 → 列印。</div>`;
};

// ── 建案總表（給工務派工用）─────────────────
VIEWS.projReport = () => {
  const p = curP(); if (!p) return lost();
  setHeader(`${p.name} 總表`, true, ['🖨 列印／PDF', () => window.print()]);
  const mode = view.mode || 'units', ksel = view.k || '';
  const floors = [...p.floors].sort(floorSort).reverse();
  let body = '';
  if (mode === 'units') {
    let rows = '';
    floors.forEach(f => f.units.forEach(u => {
      const st = unitStatus(u), I = u.insp, s = st.s;
      rows += `<tr><td><b>${esc(unitLabel(f, u))}</b></td><td>${esc(I ? I.owner : '')}</td><td>${esc(I ? I.date : '')}</td>
        <td>${I ? roundName(I.round) : ''}</td><td>${s ? s.checked + '/' + s.trades : ''}</td><td>${s ? s.def : ''}</td><td>${s ? s.fixed : ''}</td>
        <td><span class="st u-${st.k}">${st.t}</span></td></tr>`;
    }));
    body = `<table><thead><tr><th>戶別</th><th>住戶</th><th>驗屋日</th><th>階段</th><th>工項完成</th><th>缺失</th><th>已改善</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    // 缺失明細：依工項（廠商）分組，選一個工項就是那家廠商的派工單
    const all = [];
    floors.forEach(f => f.units.forEach(u => { if (u.insp) realDefs(u.insp).forEach(d => { if (!(view.open && d.fixed)) all.push({ f, u, d }); }); }));
    const ks = [...new Set(all.map(x => x.d.k))].sort(tradeOrder);
    const counts = Object.fromEntries(ks.map(k => [k, all.filter(x => x.d.k === k).length]));
    body = `<div class="row noprint" style="margin-bottom:8px">
        <select onchange="view.k=this.value;render(true)" style="width:auto;flex:1"><option value="">全部工項（${all.length}）</option>${ks.map(k =>
          `<option value="${k}" ${k === ksel ? 'selected' : ''}>${esc(tradeOf(k).name)}（${counts[k]}）</option>`).join('')}</select>
        <label class="row"><input type="checkbox" ${view.open ? 'checked' : ''} onchange="view.open=this.checked;render(true)"> 只看待改善</label></div>`;
    let any = false;
    (ksel ? [ksel] : ks).forEach(k => {
      const list = all.filter(x => x.d.k === k); if (!list.length) return; any = true;
      const tr = tradeOf(k);
      body += `<h3>${tr.icon} ${esc(tr.name)}（${list.length} 處）</h3>
        <table><thead><tr><th>戶別</th><th>位置</th><th>缺失內容</th><th>狀態</th></tr></thead><tbody>${list.map(({ f, u, d }) =>
          `<tr><td><b>${esc(unitLabel(f, u))}</b></td><td>${esc(d.loc || '—')}</td><td>${defDesc(d)}</td>
           <td>${d.fixed ? '✔ 已改善' : '待改善'}</td></tr>`).join('')}</tbody></table>`;
    });
    if (!any) body += '<p>沒有缺失。</p>';
  }
  app.innerHTML = `<div class="tabs noprint">
      <button class="${mode === 'units' ? 'on' : ''}" onclick="view.mode='units';render(true)">各戶進度</button>
      <button class="${mode === 'defects' ? 'on' : ''}" onclick="view.mode='defects';render(true)">缺失明細（派工）</button></div>
    <div class="card report"><h2>${esc(p.name)}　${mode === 'units' ? '各戶驗屋進度表' : (ksel ? esc(tradeOf(ksel).name) + ' 缺失派工單' : '缺失明細表')}</h2>
      <div class="muted" style="margin-bottom:8px">列印日期：${today()}</div>${body}</div>`;
};

// ── 驗屋要領 ─────────────────────────────
VIEWS.guide = () => {
  setHeader('驗屋要領', true);
  app.innerHTML = `<div class="card"><b>📋 驗屋流程與心法</b><ol class="tips">${TIPS.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
    <div class="card"><b>🧰 要帶的工具</b><ul class="tools">${TOOLS.map(([a, b]) => `<li><b>${esc(a)}</b>：${esc(b)}</li>`).join('')}</ul></div>
    <div class="card muted">每個檢查項目旁邊的「?」有怎麼驗和參考標準。標準為業界常用值，實際以買賣合約與公司施工規範為準。</div>`;
};

// ── 備份 ─────────────────────────────────
const allUnits = () => state.projects.flatMap(p => p.floors.flatMap(f => f.units));
async function exportAll() {
  await saveNow();
  const photos = {};
  for (const u of allUnits()) for (const ph of unitPhotos(u)) photos[ph] = photoCache[ph] || await idbGet('photos', ph);
  const blob = new Blob([JSON.stringify({ app: 'home-inspection', ver: 2, state, photos })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `驗屋備份_${today()}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importAll(input) {
  const fl = input.files[0]; input.value = ''; if (!fl) return;
  try {
    const d = JSON.parse(await fl.text());
    if (d.app !== 'home-inspection' || !d.state || !Array.isArray(d.state.projects)) throw new Error('不是驗屋系統 v2 的備份檔');
    let add = 0;
    for (const p of d.state.projects) {
      if (state.projects.some(x => x.id === p.id)) continue;
      state.projects.push(p); add++;
      for (const f of p.floors) for (const u of f.units) { migrateUnit(u); for (const ph of unitPhotos(u)) if (d.photos && d.photos[ph]) await idbPut('photos', ph, d.photos[ph]); }
    }
    save(); toast(`匯入 ${add} 個建案${d.state.projects.length - add ? `（${d.state.projects.length - add} 個已存在略過）` : ''}`); render();
  } catch (e) { toast('匯入失敗：' + e.message); }
}

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
}

// ── 啟動 ─────────────────────────────────
(async () => {
  try { state = (await idbGet('kv', 'state')) || { projects: [] }; }
  catch (e) { toast('讀取資料失敗：' + e.message); }
  if (!Array.isArray(state.projects)) state.projects = [];
  // 舊版（依房間分）的紀錄轉成依工項分
  let mig = 0;
  state.projects.forEach(p => p.floors.forEach(f => f.units.forEach(u => { if (u.insp && !u.insp.defs) { migrateUnit(u); mig++; } })));
  // 位置改名：主臥 → 主臥室、次臥 → 次臥室（v7）
  const RN = { 主臥: '主臥室', 次臥: '次臥室' };
  state.projects.forEach(p => p.floors.forEach(f => f.units.forEach(u => {
    const I = u.insp; if (!I || !I.locs) return;
    if (I.locs.some(l => RN[l]) || I.defs.some(d => RN[d.loc])) {
      I.locs = [...new Set(I.locs.map(l => RN[l] || l))]; I.defs.forEach(d => { if (RN[d.loc]) d.loc = RN[d.loc]; }); mig++;
    }
  })));
  if (mig) { saveNow(); toast(`已更新 ${mig} 戶的舊資料格式`); }
  render(true);
  // 請瀏覽器不要在空間不足時自動清掉驗屋資料
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
})();
</script>
