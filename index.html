<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小棒槌 驗屋系統</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#16202c; --muted:#627080; --line:#d9e1ea;
  --accent:#e4572e; --accent-soft:#fdece6; --steel:#1f3a5f; --ok:#2b8a3e; --ok-soft:#e6f4ea;
  --warn:#d9480f; --na:#868e96;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.5;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:var(--steel);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font-size:16px;background:var(--steel);color:#fff;cursor:pointer;font-family:inherit}
.btn.accent{background:var(--accent)}
.btn.ghost{background:#fff;color:var(--steel);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.block{display:block;width:100%;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;margin:8px 0 4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:60px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list-item{display:flex;align-items:center;gap:12px;cursor:pointer}
.list-item .ic{font-size:28px;width:40px;text-align:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}
.badge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:13px;background:var(--line);color:var(--ink);margin-left:4px}
.badge.ng{background:var(--accent);color:#fff}
.badge.ok{background:var(--ok);color:#fff}
.badge.fix{background:#1971c2;color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:52px;z-index:5;background:var(--bg);padding:6px 0}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px;font-size:14px;font-family:inherit}
.tabs button.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.group-h{font-weight:bold;color:var(--steel);margin:16px 4px 6px;font-size:15px}
.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border-left:5px solid var(--line)}
.item.s-ok{border-left-color:var(--ok)}
.item.s-ng{border-left-color:var(--accent);background:#fffaf8}
.item.s-na{border-left-color:var(--na);opacity:.7}
.item.fixed{border-left-color:#1971c2}
.it-top{display:flex;gap:8px;align-items:flex-start}
.it-t{flex:1;font-weight:bold}
.info{border:1px solid var(--line);background:#fff;border-radius:50%;width:28px;height:28px;font-size:14px;color:var(--steel);flex:none}
.tip{background:#f3f6fa;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px;color:#33414f}
.sbtns{display:flex;gap:6px;margin-top:8px}
.sbtns button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;font-size:15px;font-family:inherit}
.sbtns .on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.sbtns .on-ng{background:var(--accent);color:#fff;border-color:var(--accent)}
.sbtns .on-na{background:var(--na);color:#fff;border-color:var(--na)}
.ngbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:14px;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sev1.on{background:#f59f00;border-color:#f59f00}
.chip.sev3.on{background:#c92a2a;border-color:#c92a2a}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;background:#ddd}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:22px;padding:0}
.addph{width:76px;height:76px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;color:var(--muted);cursor:pointer;background:#fff}
.addph input{display:none}
.fixbtn{margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat div{background:#f3f6fa;border-radius:8px;padding:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:70;font-size:14px}
ol.tips li,ul.tools li{margin-bottom:6px}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}

/* 建案樓層一覽 */
.stat5{grid-template-columns:repeat(5,1fr);gap:4px}
.stat5 div{font-size:12px;padding:6px 2px;white-space:nowrap}
.stat5 b{font-size:19px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12px}
.legend span{padding:2px 8px;border-radius:10px}
.floor{padding:8px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.floor .fn{width:46px;flex:none;font-weight:bold;font-size:16px;text-align:center;border:0;background:none;font-family:inherit;color:var(--steel);padding:4px 0}
.units{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.unit{border:0;border-radius:8px;padding:5px 2px;font-family:inherit;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.unit b{font-size:17px}.unit small{font-size:11px}
.u-none{background:#e9ecef;color:#495057}
.u-doing{background:#fff3bf;color:#7a5a00}
.u-ng{background:var(--accent);color:#fff}
.u-fixed{background:#d0ebff;color:#1864ab}
.u-ok{background:var(--ok);color:#fff}
.st{padding:1px 6px;border-radius:8px;font-size:12px;white-space:nowrap}
.lay{margin-bottom:6px;flex-wrap:nowrap;gap:4px;font-size:14px}.lay input{width:46px;padding:6px 4px}
.seg{margin-bottom:6px;gap:4px}.seg input[type=number]{width:62px;padding:6px}.seg .su{min-width:90px;padding:6px}
@media print{.st,.u-ng,.u-ok{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* 大類（可展開） */
.cat{background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.cat-h{display:flex;align-items:center;gap:6px;padding:14px;cursor:pointer;font-size:17px}
.cat.open .cat-h{background:#f3f6fa;border-bottom:1px solid var(--line)}
.cat-h .arrow{color:var(--muted);width:20px;text-align:center}
.cat-b{padding:10px 12px 14px}
.def-s{display:flex;align-items:center;gap:6px;padding:10px;margin-top:8px;border:1px solid #f3d3c8;border-radius:10px;background:#fffaf8;cursor:pointer;font-size:15px}
.def-s.is-fixed{border-color:#a5d8ff;background:#f3f9ff}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* 缺失處 */
.def{background:#fff;border:1px solid #f3d3c8;border-radius:10px;padding:10px;margin-top:8px}
.def.is-fixed{border-color:#a5d8ff;background:#f3f9ff}
.chip.type.on{background:#5f3dc4;border-color:#5f3dc4}
.chip.loc.on{background:var(--steel);border-color:var(--steel)}
.report h3{font-size:16px;margin:16px 0 6px;color:var(--steel)}
/* 報告 */
.report h2{font-size:20px;margin:0 0 4px}
.report table{width:100%;border-collapse:collapse;font-size:14px}
.report th,.report td{border:1px solid #bbb;padding:6px;vertical-align:top;text-align:left}
.report th{background:#eef2f7}
.report .rph{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.report .rph img{width:120px;height:90px;object-fit:cover;border:1px solid #ccc}
.sev-t{font-weight:bold;white-space:nowrap}
.sev-t.s3{color:#c92a2a}.sev-t.s2{color:var(--warn)}.sev-t.s1{color:#e67700}
.sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:24px}
.sign div{border-top:1px solid #333;padding-top:4px;font-size:14px;text-align:center}
@media print{
  header,.noprint{display:none!important}
  body{background:#fff;padding:0}
  main{max-width:none;padding:0}
  .card{box-shadow:none;padding:0}
  .report tr{page-break-inside:avoid}
}
/* 帳號、同步、鎖定 */
#sync{font-size:12px;opacity:.9;white-space:nowrap}
.rtag{display:inline-block;font-size:12px;border-radius:8px;padding:0 6px;margin-right:4px;background:#e7f5ff;color:#1864ab;white-space:nowrap}
.rtag.r2{background:#fff4e6;color:#d9480f}.rtag.r3{background:#ebfbee;color:#2b8a3e}
.lockbar{background:#fff9db;border:1px solid #ffe066;border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:14px}
.user-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.user-row:last-child{border-bottom:0}
input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
input:disabled{background:#f1f3f5;color:#868e96}
.login{max-width:380px;margin:40px auto}
.stage{display:flex;gap:6px;margin-top:4px}.stage label{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:#fff}
.stage input{margin-right:4px}
</style>
</head>
<body>
<header>
  <button id="backBtn" onclick="goBack()" style="display:none">‹ 返回</button>
  <h1 id="title">小棒槌 驗屋系統</h1>
  <span id="sync" onclick="syncNow()"></span>
  <button id="hdrRight" style="display:none"></button>
</header>
<main id="app"></main>
<div id="layer"></div>

<script src="data.js"></script>
<script>
'use strict';
const VERSION = 'v9';
// 後端網址（Google Apps Script 網頁應用程式）
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbxmuP-JQyjoIb58P8j83R6sA1WJMGBON3WHP_gNVDLKDmSkIhdKoVuBJx7iNASHRCwe/exec';

// ── 小工具 ─────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 本地日期 YYYY-MM-DD（toISOString 是 UTC，台灣早上 8 點前會變昨天）
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const num = (v, min, max) => Math.max(min, Math.min(max, parseInt(v, 10) || 0));
const clone = o => JSON.parse(JSON.stringify(o));

// 本機測試可用 ?api=網址 改連模擬後端
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
(() => { const q = new URLSearchParams(location.search).get('api'); if (q && LOCAL) localStorage.setItem('hinsp_api', q); })();
const API = (LOCAL && localStorage.getItem('hinsp_api')) || API_DEFAULT;

// ── 本機暫存（IndexedDB）：雲端資料的副本＋還沒上傳的修改 ─────────
let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('home-inspection', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idbPut(store, key, val) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbGet(store, key) {
  const d = await db();
  return new Promise(res => { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
}
async function photoDel(id) {
  delete photoCache[id];
  const d = await db();
  return new Promise(res => { const t = d.transaction('photos', 'readwrite'); t.objectStore('photos').delete(id); t.oncomplete = res; t.onerror = res; });
}
const CK = 'cache:' + API, OK = 'outbox:' + API;
let state = { projects: [] };
// 待上傳：ph 照片、p 建案結構、u 戶別驗屋、del 刪除的建案（數字是修改序號，上傳中又改了就再傳一次）
let outbox = { ph: [], p: {}, u: {}, del: [], dropU: {} }, seq = 0;
let saveTimer, saving = Promise.resolve();
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(persistNow, 200); scheduleSync(); }
function persistNow() {
  clearTimeout(saveTimer);
  saving = saving.then(() => Promise.all([idbPut('kv', CK, { projects: state.projects }), idbPut('kv', OK, outbox)])).catch(e => toast('儲存失敗：' + e.message));
  setSyncUI();
  return saving;
}
// 改了驗屋紀錄 / 建案結構
function saveU(u, p) { p = p || curP(); u = u || curU(); outbox.u[u.id] = { pid: p.id, n: ++seq }; persist(); }
function saveP(p) { p = p || curP(); outbox.p[p.id] = ++seq; persist(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) persistNow();
  else if (auth && Date.now() - lastPull > 30000) pull(true);
});
window.addEventListener('pagehide', persistNow);
window.addEventListener('online', () => syncNow());

const photoCache = {}, fetchingPh = new Set();
async function hydratePhotos(root) {
  const need = [];
  for (const img of (root || document).querySelectorAll('img[data-pid]')) {
    const id = img.dataset.pid;
    if (!photoCache[id]) photoCache[id] = await idbGet('photos', id);
    if (photoCache[id]) img.src = photoCache[id];
    else if (!fetchingPh.has(id) && !need.includes(id)) need.push(id);
  }
  if (!need.length || !auth) return;
  need.forEach(id => fetchingPh.add(id));
  for (let i = 0; i < need.length; i += 8) {
    try {
      const r = await api('getPhotos', { ids: need.slice(i, i + 8) });
      for (const [id, data] of Object.entries(r.photos)) {
        photoCache[id] = data; await idbPut('photos', id, data);
        document.querySelectorAll(`img[data-pid="${id}"]`).forEach(im => { im.src = data; });
      }
    } catch (e) { break; }
  }
  need.forEach(id => fetchingPh.delete(id));
}
// 壓縮照片：長邊 1280px、JPEG 品質 0.7
function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('讀不到照片')); };
    im.src = url;
  });
}

// ── 帳號與雲端 ─────────────────────────────
let auth = null;
try { auth = JSON.parse(localStorage.getItem('hinsp_auth') || 'null'); } catch (e) {}
if (auth && auth.api !== API) auth = null;
const isAdmin = () => !!(auth && auth.me.role === 'admin');
const ROLE_NAME = { admin: '後台', inspector: '驗屋人員' };
class ServerError extends Error {}
async function api(action, data) {
  if (!API) throw new ServerError('還沒設定後端網址');
  let res;
  try { res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: auth && auth.token }, data || {})) }); }
  catch (e) { throw new Error('連不上網路'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('伺服器忙碌，稍後再試'); }
  if (j.auth) { logout(true); throw new ServerError(j.err || '請重新登入'); }
  if (!j.ok && !j.conflict && !j.gone) throw new ServerError(j.err || '發生錯誤');
  return j;
}
function setAuth(r) {
  auth = { api: API, token: r.token, me: r.me };
  localStorage.setItem('hinsp_auth', JSON.stringify(auth));
}
async function logout(expired) {
  if (!expired && pendingCount() && !confirm(`還有 ${pendingCount()} 筆資料沒上傳，登出會丟掉。確定登出？`)) return;
  auth = null; localStorage.removeItem('hinsp_auth');
  state = { projects: [] }; outbox = { ph: [], p: {}, u: {}, del: [], dropU: {} };
  await persistNow();
  stack.length = 0; view = { name: 'login' }; closeSheet(); render(true);
  if (expired) toast('登入已過期，請重新登入');
}
const pendingCount = () => outbox.ph.length + Object.keys(outbox.p).length + Object.keys(outbox.u).length + outbox.del.length;
let syncing = false, pulling = false, pullAfter = false, syncErr = '', syncTimer, lastPull = 0;
function setSyncUI() {
  const el = document.getElementById('sync');
  if (!auth) { el.textContent = ''; return; }
  const n = pendingCount();
  el.textContent = syncing ? '⏳ 上傳中' : n ? (syncErr ? `⚠️ ${n} 筆未上傳` : `⏳ ${n}`) : '☁️ 已同步';
  el.title = syncErr || '';
}
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1200); }
function syncNow() { if (syncErr) toast(syncErr); sync(); }
const projPayload = p => ({ id: p.id, name: p.name, addr: p.addr || '', layouts: p.layouts, created: p.created,
  floors: p.floors.map(f => ({ id: f.id, name: f.name, units: f.units.map(u => ({ id: u.id, name: u.name, layout: u.layout })) })) });
async function sync() {
  if (!auth) return;
  if (syncing) return;
  if (pulling) { scheduleSync(); return; }
  if (!pendingCount()) { syncErr = ''; setSyncUI(); return; }
  syncing = true; setSyncUI();
  let changed = false, again = false;
  try {
    // 1. 照片
    // 伺服器拒絕的（不是網路問題）就略過，不要卡住後面的資料
    const skipBad = async fn => { try { await fn(); } catch (e) { if (!(e instanceof ServerError)) throw e; toast(e.message); } };
    while (outbox.ph.length) {
      const id = outbox.ph[0], data = photoCache[id] || await idbGet('photos', id);
      if (data && allPhotoIds().has(id)) await skipBad(() => api('uploadPhoto', { id, data }));
      outbox.ph.shift(); await persistNow();
    }
    // 2. 刪除的建案
    while (outbox.del.length) { await skipBad(() => api('deleteProject', { pid: outbox.del[0] })); outbox.del.shift(); await persistNow(); }
    // 3. 建案結構
    for (const pid of Object.keys(outbox.p)) {
      const n = outbox.p[pid], p = state.projects.find(x => x.id === pid);
      if (!p) { delete outbox.p[pid]; continue; }
      let r;
      const drop = Object.keys(outbox.dropU).filter(id => outbox.dropU[id] === pid);
      try { r = await api('saveProject', { project: projPayload(p), baseV: p.v || 0, drop }); }
      catch (e) { if (!(e instanceof ServerError)) throw e; toast(e.message); delete outbox.p[pid]; again = true; continue; }
      if (r.conflict) { toast(r.err); delete outbox.p[pid]; again = true; continue; }
      p.v = r.v;
      drop.forEach(id => { delete outbox.dropU[id]; });
      if (outbox.p[pid] === n) delete outbox.p[pid];
      await persistNow();
    }
    // 4. 戶別驗屋紀錄
    for (const id of Object.keys(outbox.u)) {
      const o = outbox.u[id], p = state.projects.find(x => x.id === o.pid);
      const f = p && p.floors.find(x => x.units.some(u => u.id === id)), u = f && f.units.find(x => x.id === id);
      if (!u) { delete outbox.u[id]; continue; }
      let r;
      try { r = await api('saveUnit', { pid: p.id, uid: id, label: `${p.name} ${unitLabel(f, u)}`, insp: u.insp, baseV: u._v || 0 }); }
      catch (e) { if (!(e instanceof ServerError)) throw e; toast(`${unitLabel(f, u)}：${e.message}`); delete outbox.u[id]; again = true; continue; }
      if (r.conflict) { u.insp = r.insp; u._v = r.v; delete outbox.u[id]; toast(`${unitLabel(f, u)}：${r.err}`); changed = true; await persistNow(); continue; }
      if (r.gone) { delete outbox.u[id]; again = true; continue; }
      u._v = r.v;
      if (outbox.u[id] && outbox.u[id].n === o.n) delete outbox.u[id];
      await persistNow();
    }
    syncErr = '';
  } catch (e) {
    syncErr = e.message + '，有網路時會自動補傳';
    syncTimer = setTimeout(sync, 20000);
  } finally {
    syncing = false; setSyncUI();
  }
  if (again || pullAfter) { pullAfter = false; await pull(true); }
  else if (changed && !formView()) render();
  if (pendingCount() && !syncErr) scheduleSync();
}
// 從雲端讀最新資料，本機還沒上傳的修改優先
async function pull(quiet) {
  if (!auth || pulling) return;
  if (syncing) { pullAfter = true; return; } // 上傳中先不讀，免得拿到上傳前的舊資料
  pulling = true;
  let r;
  try { r = await api('list'); }
  catch (e) { if (!quiet) toast('讀取雲端資料失敗：' + e.message); return; }
  finally { pulling = false; }
  lastPull = Date.now();
  const byU = {}; r.units.forEach(x => { byU[x.uid] = x; });
  const local = state.projects;
  const projects = r.projects.filter(sp => !outbox.del.includes(sp.id)).map(sp => {
    const lp = local.find(p => p.id === sp.id);
    const base = lp && outbox.p[sp.id] ? lp : sp;
    const lunits = {}; if (lp) lp.floors.forEach(f => f.units.forEach(u => { lunits[u.id] = u; }));
    base.floors.forEach(f => f.units.forEach(u => {
      const lu = lunits[u.id];
      if (lu && outbox.u[u.id]) { u.insp = lu.insp; u._v = lu._v; return; }
      const s = byU[u.id];
      u.insp = s ? s.insp : null; u._v = s ? s.v : 0; u._by = s ? s.by : ''; u._at = s ? s.at : '';
    }));
    return base;
  });
  local.forEach(lp => { if (outbox.p[lp.id] && !projects.some(p => p.id === lp.id)) projects.push(lp); });
  projects.sort((a, b) => (b.created || 0) - (a.created || 0));
  state.projects = projects;
  persistNow();
  if (!formView() && !document.getElementById('layer').innerHTML) render();
  if (!quiet) toast('已更新成雲端最新資料');
}

// ── 資料結構 ─────────────────────────────
// 建案 project { id, name, addr, layouts, floors:[floor], v }
// 樓層 floor   { id, name, units:[unit] }
// 戶別 unit    { id, name, layout:{beds,baths,balc,common}, insp:null | insp, _v }
// 驗屋 insp    { date, inspector, owner, phone, round, done:{階段:日期}, locs:[位置], checked:{工項:true}, defs:[缺失] }
// 缺失 def     { id, r:建立的階段, k:工項, cat:大類, type:種類, subs:[小項目], loc:位置, note, photos, fixed }
// 階段：1 交屋部初驗、2 屋主初驗、3 複驗、4 第 2 次複驗…；階段完成後，那一階段的缺失只有後台能改。
const OTHER = { k: 'other', name: '其他', icon: '📌', cats: [] };
const tradeOf = k => TRADES.find(t => t.k === k) || OTHER;
const tradeOrder = (a, b) => { const i = k => { const n = TRADES.findIndex(t => t.k === k); return n < 0 ? 99 : n; }; return i(a) - i(b); };
const newDef = (k, cat, r) => ({ id: uid(), r, k, cat, type: '', subs: [], loc: '', note: '', photos: [], fixed: false });
// 空白缺失（什麼都沒選）不算數
const isEmptyDef = d => !d.type && !d.subs.length && !d.loc && !d.note && !d.photos.length;
const realDefs = I => I.defs.filter(d => !isEmptyDef(d));
// 這一戶要檢查的工項
const unitTrades = I => {
  const ks = TRADES.filter(t => !t.optional || I.common).map(t => t.k);
  realDefs(I).forEach(d => { if (!ks.includes(d.k)) ks.push(d.k); });
  return ks.sort(tradeOrder);
};
// 房間命名：兩房兩衛 → 主臥室、次臥室；兩房一衛 → 臥室1、臥室2；三房以上 → 主臥室、臥室1、臥室2…
function bedNames(beds, baths) {
  if (beds <= 0) return [];
  if (beds === 1) return ['臥室'];
  if (beds === 2) return baths >= 2 ? ['主臥室', '次臥室'] : ['臥室1', '臥室2'];
  return ['主臥室', ...Array.from({ length: beds - 1 }, (_, k) => '臥室' + (k + 1))];
}
// 兩衛 → 主衛浴室、次衛浴室
function bathNames(n) {
  if (n <= 0) return [];
  if (n === 1) return ['浴室'];
  return ['主衛浴室', '次衛浴室', ...Array.from({ length: n - 2 }, (_, k) => '浴室' + (k + 3))];
}
// 兩個陽台 → 前陽台、工作陽台；一個陽台 → 工作陽台
function balcNames(n) {
  if (n <= 0) return [];
  if (n === 1) return ['工作陽台'];
  return ['前陽台', '工作陽台', ...Array.from({ length: n - 2 }, (_, k) => '陽台' + (k + 3))];
}
const makeLocs = L => ['玄關', '客廳', '餐廳', '廚房', ...bedNames(L.beds, L.baths), ...bathNames(L.baths), ...balcNames(L.balc), '走道', '全戶'];

function stats(I) {
  const ds = realDefs(I), ks = unitTrades(I);
  return { def: ds.length, fixed: ds.filter(d => d.fixed).length, trades: ks.length, checked: ks.filter(k => I.checked[k]).length };
}
const unitPhotos = u => u.insp ? u.insp.defs.flatMap(d => d.photos) : [];
const unitLabel = (f, u) => `${f.name}-${u.name}`;
const roundName = r => r <= 1 ? '交屋部初驗' : r === 2 ? '屋主初驗' : r === 3 ? '複驗' : `第 ${r - 2} 次複驗`;
const rShort = r => (r || 1) <= 1 ? '交屋部' : r === 2 ? '屋主' : '複驗';
const rTag = d => `<span class="rtag r${Math.min(d.r || 1, 3)}">${rShort(d.r)}</span>`;
const roundDone = I => (I.done || {})[I.round];
// 鎖定：缺失建立的那個階段已完成 → 只有後台能改
const locked = (I, d) => !!(I.done || {})[d.r || 1];
const canEditDef = (I, d) => isAdmin() || !locked(I, d);
const canWork = I => isAdmin() || !roundDone(I);
// 這一輪還沒按「完成」→ 黃色驗屋中；按了完成 → 有待改善紅色、全部改好藍色、沒缺失綠色
function unitStatus(u) {
  if (!u.insp) return { k: 'none', t: '未驗' };
  const I = u.insp, s = stats(I), open = s.def - s.fixed, rn = rShort(I.round) === '複驗' ? roundName(I.round) : rShort(I.round) + '驗';
  if (!roundDone(I)) return { k: 'doing', t: open ? `${rn}中 缺${open}` : `${rn}中`, s };
  if (open > 0) return { k: 'ng', t: `待改善 ${open}`, s };
  if (s.def) return { k: 'fixed', t: '已改善', s };
  return { k: 'ok', t: '合格', s };
}
// v1 舊版紀錄轉成新版（只記缺失）：舊缺失放在原工項（或「其他」）的「舊版紀錄」大類
function migrateUnit(u) {
  const old = u.insp; if (!old || old.defs) return;
  const locs = old.locs ? [...old.locs] : makeLocs(u.layout), defs = [];
  const add = (k, t, d, loc) => {
    if (loc && !locs.includes(loc)) locs.push(loc);
    defs.push({ id: uid(), k, cat: '舊版紀錄', subs: [t, ...(d.tags || [])], loc: loc || '', sev: d.sev || 2, note: d.note || '', photos: d.photos || [], fixed: !!d.fixed });
  };
  if (old.rooms) old.rooms.forEach(r => r.items.forEach(it => { if (it.s === 'ng') add('other', it.t, it, r.name); }));
  if (old.items) old.items.forEach(it => { if (it.s === 'ng') it.defs.forEach(d => add(it.k, it.t, d, d.loc)); });
  u.insp = { date: old.date, inspector: old.inspector, owner: old.owner, phone: old.phone, round: old.round || 1, common: !!u.layout.common, locs, checked: {}, defs };
}

function migrateRounds(I) {

async function uploadOld() {

function segRow(from, to, units) {
  return `<div class="seg row"><input type="number" class="sf" value="${esc(from)}"> F ～ <input type="number" class="st2" value="${esc(to)}"> F
    <input type="text" class="su grow" value="${esc(units)}" oninput="drawLayouts()" placeholder="A,B,C">
    <button class="btn ghost small" onclick="this.parentNode.remove();drawLayouts()" title="刪除這段">✕</button></div>`;
}
function addSeg() {
  const rows = [...document.querySelectorAll('#p_segs .seg')], last = rows[rows.length - 1];
  const to = last ? parseInt(last.querySelector('.st2').value, 10) || 1 : 1;
  const units = last ? last.querySelector('.su').value : 'A,B';
  document.getElementById('p_segs').insertAdjacentHTML('beforeend', segRow(to + 1, to + 4, units));
  drawLayouts();
}
const readSegs = () => [...document.querySelectorAll('#p_segs .seg')].map(r => ({
  from: parseInt(r.querySelector('.sf').value, 10), to: parseInt(r.querySelector('.st2').value, 10), units: parseUnits(r.querySelector('.su').value) }));
const parseUnits = s => [...new Set(s.split(/[,，、\s]+/).map(x => x.trim()).filter(Boolean))].slice(0, 30);
function drawLayouts() {
  const box = document.getElementById('p_layouts');
  const old = {};
  box.querySelectorAll('[data-u]').forEach(r => { old[r.dataset.u] = [...r.querySelectorAll('input')].map(i => i.value); });
  box.innerHTML = [...new Set(readSegs().flatMap(g => g.units))].map(u => {
    const v = old[u] || [3, 2, 2];
    return `<div class="row lay" data-u="${esc(u)}"><b style="width:44px">${esc(u)} 戶</b>
      <input type="number" value="${esc(v[0])}" min="0" max="8"> 房 <input type="number" value="${esc(v[1])}" min="0" max="6"> 衛 <input type="number" value="${esc(v[2])}" min="0" max="5"> 陽台</div>`;
  }).join('');

function createProject() {
  if (!needAdmin()) return;
  const v = id => document.getElementById(id).value.trim();
  if (!v('p_name')) { toast('請填建案名稱'); return; }
  const segs = readSegs();
  if (!segs.length) { toast('請至少設一段樓層'); return; }
  const byFloor = new Map();
  for (const g of segs) {
    if (isNaN(g.from) || isNaN(g.to) || g.to < g.from || g.to - g.from > 80) { toast(`樓層範圍不對：${g.from}～${g.to}F`); return; }
    if (!g.units.length) { toast(`${g.from}～${g.to}F 沒填戶別`); return; }
    for (let k = g.from; k <= g.to; k++) {
      if (k === 0) continue;
      if (byFloor.has(k)) { toast(`樓層重複：${k > 0 ? k + 'F' : 'B' + (-k)} 在兩段裡都有`); return; }
      byFloor.set(k, g.units);
    }
  }
  const layouts = {};
  document.querySelectorAll('#p_layouts [data-u]').forEach(r => {
    const n = [...r.querySelectorAll('input')].map(i => i.value);
    layouts[r.dataset.u] = { beds: num(n[0], 0, 8), baths: num(n[1], 0, 6), balc: num(n[2], 0, 5), common: document.getElementById('p_common').checked };
  });
  const floors = [...byFloor.keys()].sort((a, b) => b - a).map(k => ({ id: uid(), name: k > 0 ? k + 'F' : 'B' + (-k),
    units: byFloor.get(k).map(n => ({ id: uid(), name: n, layout: { ...layouts[n] }, insp: null, _v: 0 })) }));
  const p = { id: uid(), name: v('p_name'), addr: v('p_addr'), layouts, floors, created: Date.now(), v: 0 };
  state.projects.unshift(p); saveP(p);
  stack.pop(); view = { name: 'project', pid: p.id }; history.replaceState({ d: stack.length }, ''); stack.push({ name: 'home' }); render(true);
}

function applyLayouts() {

function setUnitLayout(p, u, L) {
  const same = JSON.stringify(u.layout) === JSON.stringify(L);
  u.layout = L;
  if (!u.insp || same) return;
  const used = u.insp.defs.map(d => d.loc).filter(Boolean), locs = makeLocs(L);
  used.forEach(l => { if (!locs.includes(l)) locs.push(l); });
  u.insp.locs = locs; u.insp.common = !!L.common;
  saveU(u, p);
}

  sheet(`<b>調整某幾層的戶別</b>
    <div class="muted">例：11～14F 只剩 A,B → 這幾層會變成只有 A、B 兩戶（缺的戶自動補上，多的戶刪掉）。</div>

    <label class="f">這幾層的戶別</label><input type="text" id="b_units" placeholder="A,B">
    <button class="btn accent block" onclick="batchApply()">套用</button><button class="btn ghost block" onclick="closeSheet()">取消</button>`);
}
async function batchApply() {
  if (!needAdmin()) return;
  const p = curP(), from = parseInt(document.getElementById('b_from').value, 10), to = parseInt(document.getElementById('b_to').value, 10);
  const names = parseUnits(document.getElementById('b_units').value);
  if (isNaN(from) || isNaN(to) || to < from) { toast('樓層範圍不對'); return; }
  if (!names.length) { toast('請填戶別'); return; }
  const floors = p.floors.filter(f => { const k = floorNum(f.name); return k >= from && k <= to && k !== 0 && k !== 999; });
  if (!floors.length) { toast('這個範圍沒有樓層'); return; }
  const drop = floors.flatMap(f => f.units.filter(u => !names.includes(u.name)).map(u => ({ f, u })));
  const kept = drop.filter(x => x.u.insp);
  const msg = `${floors.map(f => f.name).sort((a, b) => floorNum(a) - floorNum(b)).join('、')} 改成 ${names.join('、')}。`
    + (drop.length - kept.length ? `\n會刪掉 ${drop.length - kept.length} 戶（還沒驗屋的）。` : '')
    + (kept.length ? `\n${kept.map(x => unitLabel(x.f, x.u)).join('、')} 已經有驗屋紀錄，會保留不刪。` : '');
  if (!confirm(msg + '\n\n確定套用？')) return;
  for (const f of floors) {
    const old = f.units;
    f.units = names.map(n => old.find(u => u.name === n) || { id: uid(), name: n, layout: defaultLayout(p, n), insp: null, _v: 0 })
      .concat(old.filter(u => !names.includes(u.name) && u.insp));
  }
  saveP(p); closeSheet(); render(); toast('已調整');
}

    body = `<table><thead><tr><th>戶別</th><th>住戶</th><th>驗屋日</th><th>階段</th><th>工項完成</th><th>缺失</th><th>已改善</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    // 缺失明細：依工項（廠商）分組，選一個工項就是那家廠商的派工單
    const all = [];
    floors.forEach(f => f.units.forEach(u => { if (u.insp) realDefs(u.insp).forEach(d => { if (!(view.open && d.fixed)) all.push({ f, u, d }); }); }));
    const ks = [...new Set(all.map(x => x.d.k))].sort(tradeOrder);
    const counts = Object.fromEntries(ks.map(k => [k, all.filter(x => x.d.k === k).length]));
    body = `<div class="row noprint" style="margin-bottom:8px">
        <select onchange="view.k=this.value;render(true)" style="width:auto;flex:1"><option value="">全部工項（${all.length}）</option>${ks.map(k =>
          `<option value="${k}" ${k === ksel ? 'selected' : ''}>${esc(tradeOf(k).name)}（${counts[k]}）</option>`).join('')}</select>
        <label class="row"><input type="checkbox" ${view.open ? 'checked' : ''} onchange="view.open=this.checked;render(true)"> 只看待改善</label></div>`;
    let any = false;
    (ksel ? [ksel] : ks).forEach(k => {
      const list = all.filter(x => x.d.k === k); if (!list.length) return; any = true;
      const tr = tradeOf(k);
      body += `<h3>${tr.icon} ${esc(tr.name)}（${list.length} 處）</h3>
        <table><thead><tr><th>戶別</th><th>階段</th><th>位置</th><th>缺失內容</th><th>狀態</th></tr></thead><tbody>${list.map(({ f, u, d }) =>
          `<tr><td><b>${esc(unitLabel(f, u))}</b></td><td>${rShort(d.r)}</td><td>${esc(d.loc || '—')}</td><td>${defDesc(d)}</td>
           <td>${d.fixed ? '✔ 已改善' : '待改善'}</td></tr>`).join('')}</tbody></table>`;
    });
    if (!any) body += '<p>沒有缺失。</p>';
  }
  app.innerHTML = `<div class="tabs noprint">
      <button class="${mode === 'units' ? 'on' : ''}" onclick="view.mode='units';render(true)">各戶進度</button>
      <button class="${mode === 'defects' ? 'on' : ''}" onclick="view.mode='defects';render(true)">缺失明細（派工）</button></div>
    <div class="card report"><h2>${esc(p.name)}　${mode === 'units' ? '各戶驗屋進度表' : (ksel ? esc(tradeOf(ksel).name) + ' 缺失派工單' : '缺失明細表')}</h2>
      <div class="muted" style="margin-bottom:8px">列印日期：${today()}</div>${body}</div>`;
};

// ── 驗屋要領 ─────────────────────────────
VIEWS.guide = () => {
  setHeader('驗屋要領', true);
  app.innerHTML = `<div class="card"><b>📋 驗屋流程與心法</b><ol class="tips">${TIPS.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
    <div class="card"><b>🧰 要帶的工具</b><ul class="tools">${TOOLS.map(([a, b]) => `<li><b>${esc(a)}</b>：${esc(b)}</li>`).join('')}</ul></div>
    <div class="card muted">每個大類打開後有「💡」怎麼驗和參考標準。標準為業界常用值，實際以買賣合約與公司施工規範為準。</div>`;
};

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}

// ── 啟動 ─────────────────────────────────
(async () => {
  try {
    state = (await idbGet('kv', CK)) || { projects: [] };
    outbox = (await idbGet('kv', OK)) || outbox; outbox.dropU = outbox.dropU || {};
  } catch (e) { toast('讀取資料失敗：' + e.message); }
  if (!Array.isArray(state.projects)) state.projects = [];
  view = auth ? { name: 'home' } : { name: 'login' };
  render(true);
  if (auth) { await pull(true); sync(); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
